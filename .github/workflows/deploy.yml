name: deploy

# Deploys pre-production on every push to main: builds the agent release and the images for the
# commit, pushes the images to Fly.io's registry, migrates the database (Supabase), then deploys
# every Fly.io app with the commit's image. fly/RUNBOOK.md sets up the accounts, apps and secrets
# this expects; the GitHub environment `preprod` holds its variables and secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  agent-release:
    runs-on: windows-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tools
        run: |
          dotnet tool install --global wix --version 7.0.0
          npm ci --prefix device/extension

      # Code signing with Azure Trusted Signing, when the environment configures an account.
      - uses: azure/login@v2
        if: ${{ vars.SAC_SIGNING_ACCOUNT != '' }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: signing client
        if: ${{ vars.SAC_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory $dir -ExcludeVersion | Out-Null
          @{ Endpoint = '${{ vars.SAC_SIGNING_ENDPOINT }}'; CodeSigningAccountName = '${{ vars.SAC_SIGNING_ACCOUNT }}'; CertificateProfileName = '${{ vars.SAC_SIGNING_PROFILE }}' } |
            ConvertTo-Json | Set-Content (Join-Path $dir 'metadata.json')
          "SAC_SIGN_DLIB=$dir\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          "SAC_SIGN_METADATA=$dir\metadata.json" >> $env:GITHUB_ENV
          "SIGN=--sign" >> $env:GITHUB_ENV

      - name: build the MSI and the browser extension
        shell: pwsh
        env:
          CLASSIFIER_KEY: ${{ secrets.SAC_CLASSIFIER_SIGNING_KEY }}
          EXTENSION_KEY: ${{ secrets.SAC_EXTENSION_SIGNING_KEY }}
        run: |
          $keys = Join-Path $env:RUNNER_TEMP 'keys'
          New-Item -ItemType Directory -Force $keys | Out-Null
          # Written with .NET directly: Set-Content binds these arguments positionally in the wrong
          # order and the files never appear.
          [IO.File]::WriteAllText((Join-Path $keys 'policy.pub'), '${{ vars.SAC_POLICY_PUBLIC_KEY }}')
          [IO.File]::WriteAllText((Join-Path $keys 'classifier.key'), $env:CLASSIFIER_KEY)
          [IO.File]::WriteAllText((Join-Path $keys 'extension.pem'), $env:EXTENSION_KEY)
          $out = Join-Path $env:RUNNER_TEMP 'agent-release'
          node device/installer/release-msi.mjs --version "1.0.${{ github.run_number }}" `
            --policy-key-file (Join-Path $keys 'policy.pub') --policy-key-id policy-key-1 `
            --classifier-key (Join-Path $keys 'classifier.key') `
            --classifier-rules device/classifier-host/rules/default.json `
            --classifier-model device/classifier-host/rules/model.json `
            --extension-key (Join-Path $keys 'extension.pem') `
            --wix-eula wix7 $env:SIGN --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force $keys
      - uses: actions/upload-artifact@v4
        with:
          name: agent-release
          path: ${{ runner.temp }}/agent-release
          if-no-files-found: error

  images:
    needs: agent-release
    runs-on: ubuntu-latest
    environment: preprod
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_PREFIX: ${{ vars.FLY_APP_PREFIX }}
      SAC_IMAGE_TAG: ${{ github.sha }}
      FLY_ORG: ${{ vars.FLY_ORG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-release
          path: ${{ runner.temp }}/agent-release
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        with:
          version: 0.4.115
      - name: check the apps exist
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --org "$FLY_ORG" --quiet | awk '{ print $1 }')"
          for component in edge ingest-api control-api content-vault query-api dashboard jobs migrate; do
            if ! grep -qxF "$FLY_APP_PREFIX-$component" <<<"$apps"; then
              echo "::error::the app $FLY_APP_PREFIX-$component does not exist in the Fly.io organization $FLY_ORG (fly/RUNBOOK.md)"
              exit 1
            fi
          done
      - name: build and push
        run: |
          set -euo pipefail
          flyctl auth docker
          # Each image goes to its app's repository, registry.fly.io/<app>:<commit>.
          build() {
            local tag="registry.fly.io/$FLY_APP_PREFIX-$1:$SAC_IMAGE_TAG"
            docker build --tag "$tag" --file "$2" "${@:3}" .
            docker push "$tag"
          }
          build edge          services/edge/Dockerfile
          build ingest-api    services/ingest-api/Dockerfile
          build control-api   services/control-api/Dockerfile --build-context agent-release="${{ runner.temp }}/agent-release"
          build content-vault services/content-vault/Dockerfile
          build query-api     services/query-api/Dockerfile
          build dashboard     services/dashboard/Dockerfile
          build migrate       services/database/Dockerfile
          # The jobs app's image adds the scheduler to the jobs image, built here first.
          docker build --tag "sac-jobs:$SAC_IMAGE_TAG" --file services/jobs/Dockerfile .
          build jobs          fly/jobs/Dockerfile --build-arg "JOBS_IMAGE=sac-jobs:$SAC_IMAGE_TAG"

  # The schema is migrated before any app runs the new image, so new code never meets an old
  # schema. migrate runs as the migrate app's release command: its output is in this log, and its
  # failure fails the run.
  migrate:
    needs: images
    runs-on: ubuntu-latest
    environment: preprod
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_PREFIX: ${{ vars.FLY_APP_PREFIX }}
      SAC_IMAGE_TAG: ${{ github.sha }}
      PG_HOST: ${{ vars.SAC_PG_HOST }}
      PG_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        with:
          version: 0.4.115
      - name: migrate
        run: |
          fly/scripts/deploy-app.sh migrate --update-only --deploy-retries 0 \
            -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=sac_admin.$PG_REF"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: preprod
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_PREFIX: ${{ vars.FLY_APP_PREFIX }}
      SAC_IMAGE_TAG: ${{ github.sha }}
      PG_HOST: ${{ vars.SAC_PG_HOST }}
      PG_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DEVICE_FQDN: ${{ vars.SAC_DEVICE_FQDN }}
      ANALYST_FQDN: ${{ vars.SAC_ANALYST_FQDN }}
      ENTRA_CLIENT_ID: ${{ vars.SAC_ENTRA_APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        with:
          version: 0.4.115
      # The settings that differ per environment; fly/<component>/fly.toml holds the rest.
      - name: deploy the apps
        run: |
          set -euo pipefail
          fly/scripts/deploy-app.sh ingest-api -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=ingest-api.$PG_REF"
          fly/scripts/deploy-app.sh content-vault -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=content-vault.$PG_REF" -e "SAC_RETRIEVAL_URL_BASE=https://$ANALYST_FQDN"
          fly/scripts/deploy-app.sh control-api -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=control-api.$PG_REF" -e "SAC_PUBLIC_URL=https://$ANALYST_FQDN" -e "SAC_PUBLIC_DEVICE_ENDPOINT=https://$DEVICE_FQDN" -e "SAC_ENTRA_CLIENT_ID=$ENTRA_CLIENT_ID"
          fly/scripts/deploy-app.sh query-api -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=query-api.$PG_REF"
          fly/scripts/deploy-app.sh dashboard -e "SAC_PUBLIC_URL=https://$ANALYST_FQDN"
          fly/scripts/deploy-app.sh jobs -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=jobs.$PG_REF"
          fly/scripts/deploy-app.sh edge
