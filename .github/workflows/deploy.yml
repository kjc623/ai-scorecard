name: deploy

# Deploys pre-production on every push to main. tools/deploy-plan.mjs compares the commit with the
# one the last successful run shipped and picks what changed: the agent release when device/
# changed, and each Fly.io app whose code, shared modules or fly/ directory changed. The run builds
# those images with the commit as their tag, pushes them to Fly.io's registry, migrates the database
# (Supabase) when the migrator changed, then deploys those apps; every other app keeps running what
# it runs. A change to this workflow, fly/scripts or the plan, a run with no earlier success, and a
# manual run deploy everything, so a changed variable or secret in `preprod` takes a manual run.
# fly/RUNBOOK.md sets up the accounts, apps and secrets this expects; the GitHub environment
# `preprod` holds its variables and secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      agent: ${{ steps.plan.outputs.agent }}
      apps: ${{ steps.plan.outputs.apps }}
      migrate: ${{ steps.plan.outputs.migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            node tools/deploy-plan.mjs --all
          else
            base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
            node tools/deploy-plan.mjs --base "$base"
          fi

  agent-release:
    needs: plan
    if: needs.plan.outputs.agent == 'true'
    runs-on: windows-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tools
        run: |
          dotnet tool install --global wix --version 7.0.0
          npm ci --prefix device/extension

      # Code signing with Azure Trusted Signing, when the environment configures an account.
      - uses: azure/login@v2
        if: ${{ vars.SAC_SIGNING_ACCOUNT != '' }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: signing client
        if: ${{ vars.SAC_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory $dir -ExcludeVersion | Out-Null
          @{ Endpoint = '${{ vars.SAC_SIGNING_ENDPOINT }}'; CodeSigningAccountName = '${{ vars.SAC_SIGNING_ACCOUNT }}'; CertificateProfileName = '${{ vars.SAC_SIGNING_PROFILE }}' } |
            ConvertTo-Json | Set-Content (Join-Path $dir 'metadata.json')
          "SAC_SIGN_DLIB=$dir\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          "SAC_SIGN_METADATA=$dir\metadata.json" >> $env:GITHUB_ENV
          "SIGN=--sign" >> $env:GITHUB_ENV

      - name: build the MSI and the browser extension
        shell: pwsh
        env:
          CLASSIFIER_KEY: ${{ secrets.SAC_CLASSIFIER_SIGNING_KEY }}
          EXTENSION_KEY: ${{ secrets.SAC_EXTENSION_SIGNING_KEY }}
        run: |
          $keys = Join-Path $env:RUNNER_TEMP 'keys'
          New-Item -ItemType Directory -Force $keys | Out-Null
          # Written with .NET directly: Set-Content binds these arguments positionally in the wrong
          # order and the files never appear.
          [IO.File]::WriteAllText((Join-Path $keys 'policy.pub'), '${{ vars.SAC_POLICY_PUBLIC_KEY }}')
          [IO.File]::WriteAllText((Join-Path $keys 'classifier.key'), $env:CLASSIFIER_KEY)
          [IO.File]::WriteAllText((Join-Path $keys 'extension.pem'), $env:EXTENSION_KEY)
          $out = Join-Path $env:RUNNER_TEMP 'agent-release'
          node device/installer/release-msi.mjs --version "1.0.${{ github.run_number }}" `
            --policy-key-file (Join-Path $keys 'policy.pub') --policy-key-id policy-key-1 `
            --classifier-key (Join-Path $keys 'classifier.key') `
            --classifier-rules device/classifier-host/rules/default.json `
            --classifier-model device/classifier-host/rules/model.json `
            --extension-key (Join-Path $keys 'extension.pem') `
            --extension-update-url 'https://${{ vars.SAC_ANALYST_FQDN }}/v1/extension/updates.xml' `
            --wix-eula wix7 $env:SIGN --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force $keys
      - uses: actions/upload-artifact@v4
        with:
          name: agent-release
          path: ${{ runner.temp }}/agent-release
          if-no-files-found: error

  images:
    needs: [plan, agent-release]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.agent-release.result == 'success' || needs.agent-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: preprod
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_PREFIX: ${{ vars.FLY_APP_PREFIX }}
      SAC_IMAGE_TAG: ${{ github.sha }}
      FLY_ORG: ${{ vars.FLY_ORG }}
      APPS: ${{ needs.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.agent == 'true'
        with:
          name: agent-release
          path: ${{ runner.temp }}/agent-release
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        with:
          version: 0.4.115
      # With no new release, the release is the one in the running control-api image: a rebuilt
      # control-api keeps serving it, and the run's agent-release artifact is the release pre-prod
      # serves, as tools/testbed/deploy.mjs expects.
      - name: keep the release pre-prod serves
        if: needs.plan.outputs.agent != 'true'
        run: |
          set -euo pipefail
          flyctl auth docker
          image="$(flyctl machines list --app "$FLY_APP_PREFIX-control-api" --json | jq -r '[.[].config.image | select(. != null)] | unique | if length == 1 then .[0] else error("control-api runs \(length) images") end')"
          echo "control-api runs $image"
          docker pull --quiet "$image"
          container="$(docker create "$image")"
          docker cp "$container:/opt/sac/agent-release/." "${{ runner.temp }}/agent-release"
          docker rm "$container" >/dev/null
          if [[ ! -f "${{ runner.temp }}/agent-release/release.json" ]]; then
            echo "::error::$image carries no agent release; run this workflow manually to build one"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.agent != 'true'
        with:
          name: agent-release
          path: ${{ runner.temp }}/agent-release
          if-no-files-found: error
      - name: check the apps exist
        run: |
          set -euo pipefail
          apps="$(flyctl apps list --org "$FLY_ORG" --quiet | awk '{ print $1 }')"
          for component in edge ingest-api control-api content-vault query-api dashboard jobs migrate; do
            if ! grep -qxF "$FLY_APP_PREFIX-$component" <<<"$apps"; then
              echo "::error::the app $FLY_APP_PREFIX-$component does not exist in the Fly.io organization $FLY_ORG (fly/RUNBOOK.md)"
              exit 1
            fi
          done
      - name: build and push
        run: |
          set -euo pipefail
          flyctl auth docker
          # Each image goes to its app's repository, registry.fly.io/<app>:<commit>; only the
          # planned apps are built.
          build() {
            [[ " $APPS " == *" $1 "* ]] || return 0
            local tag="registry.fly.io/$FLY_APP_PREFIX-$1:$SAC_IMAGE_TAG"
            docker build --tag "$tag" --file "$2" "${@:3}" .
            docker push "$tag"
          }
          build edge          services/edge/Dockerfile
          build ingest-api    services/ingest-api/Dockerfile
          build control-api   services/control-api/Dockerfile --build-context agent-release="${{ runner.temp }}/agent-release"
          build content-vault services/content-vault/Dockerfile
          build query-api     services/query-api/Dockerfile
          build dashboard     services/dashboard/Dockerfile
          build migrate       services/database/Dockerfile
          # The jobs app's image adds the scheduler to the jobs image, built here first.
          if [[ " $APPS " == *" jobs "* ]]; then
            docker build --tag "sac-jobs:$SAC_IMAGE_TAG" --file services/jobs/Dockerfile .
          fi
          build jobs          fly/jobs/Dockerfile --build-arg "JOBS_IMAGE=sac-jobs:$SAC_IMAGE_TAG"

  # The schema is migrated before any app runs the new image, so new code never meets an old
  # schema. migrate runs as the migrate app's release command: its output is in this log, and its
  # failure fails the run.
  migrate:
    needs: [plan, images]
    if: ${{ !cancelled() && needs.images.result == 'success' && needs.plan.outputs.migrate == 'true' }}
    runs-on: ubuntu-latest
    environment: preprod
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_PREFIX: ${{ vars.FLY_APP_PREFIX }}
      SAC_IMAGE_TAG: ${{ github.sha }}
      PG_HOST: ${{ vars.SAC_PG_HOST }}
      PG_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        with:
          version: 0.4.115
      - name: migrate
        run: |
          fly/scripts/deploy-app.sh migrate --update-only --deploy-retries 0 \
            -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=sac_admin.$PG_REF"

  deploy:
    needs: [plan, images, migrate]
    if: ${{ !cancelled() && needs.images.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: preprod
    env:
      APPS: ${{ needs.plan.outputs.apps }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_PREFIX: ${{ vars.FLY_APP_PREFIX }}
      SAC_IMAGE_TAG: ${{ github.sha }}
      PG_HOST: ${{ vars.SAC_PG_HOST }}
      PG_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DEVICE_FQDN: ${{ vars.SAC_DEVICE_FQDN }}
      ANALYST_FQDN: ${{ vars.SAC_ANALYST_FQDN }}
      ENTRA_CLIENT_ID: ${{ vars.SAC_ENTRA_APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        with:
          version: 0.4.115
      # The settings that differ per environment; fly/<component>/fly.toml holds the rest.
      - name: deploy the apps
        run: |
          set -euo pipefail
          skip() { [[ " $APPS " != *" $1 "* ]]; }
          skip ingest-api || fly/scripts/deploy-app.sh ingest-api -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=ingest-api.$PG_REF"
          skip content-vault || fly/scripts/deploy-app.sh content-vault -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=content-vault.$PG_REF" -e "SAC_RETRIEVAL_URL_BASE=https://$ANALYST_FQDN"
          skip control-api || fly/scripts/deploy-app.sh control-api -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=control-api.$PG_REF" -e "SAC_PUBLIC_URL=https://$ANALYST_FQDN" -e "SAC_PUBLIC_DEVICE_ENDPOINT=https://$DEVICE_FQDN" -e "SAC_ENTRA_CLIENT_ID=$ENTRA_CLIENT_ID"
          skip query-api || fly/scripts/deploy-app.sh query-api -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=query-api.$PG_REF"
          skip dashboard || fly/scripts/deploy-app.sh dashboard -e "SAC_PUBLIC_URL=https://$ANALYST_FQDN"
          skip jobs || fly/scripts/deploy-app.sh jobs -e "SAC_PG_HOST=$PG_HOST" -e "SAC_PG_USER=jobs.$PG_REF"
          skip edge || fly/scripts/deploy-app.sh edge
