name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: accept (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: az bicep install
      # Docker and Chrome are on the hosted runner, so the database and browser gates run here.
      # The hosted Ubuntu runner has gcc, so the Go suites also run under the race detector.
      - run: node tools/accept.mjs --skip installer --race

  windows:
    name: accept (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The agent's production platform: its Go modules and the installer are checked on Windows too.
      - run: node tools/accept.mjs --only go,installer
