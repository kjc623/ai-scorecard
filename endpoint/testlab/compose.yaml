# The testlab: capture-core as a Linux appliance, proving interception + OS trust + cli.shim
# end-to-end against a real HTTPS client.
#
#   node endpoint/testlab/run.mjs            # build binaries + images, up, assert, down
#   node endpoint/testlab/run.mjs --keep     # same, but leave the lab running for inspection
#   node endpoint/testlab/run.mjs --down     # tear down (volume included)
#
# Three services, one image (sac/testlab-endpoint:dev):
#   * pki      — a one-shot: mints the "upstream" CA and a server cert for api.anthropic.test into
#                a named volume (/pki). The device CA itself is minted separately by sac-bundle
#                inside the device container, so the two trust roots never collide.
#   * upstream — a Node https server on 0.0.0.0:443 presenting /pki/upstream-server.crt|key. It is
#                the destination the device intercepts (network alias api.anthropic.test).
#   * device   — the appliance: installs the upstream CA into its OS trust store, mints the device
#                CA + signed policy bundle, then runs capture-core with --trust-install and
#                --cli-shim. Its entrypoint holds the container alive so run.mjs can exec the checks.
#
# No secret is in this file: the upstream PKI is minted fresh into the /pki volume each run, and the
# device CA/key are minted fresh into the device container by sac-bundle.
name: sac-testlab

networks:
  default:
    name: scorecard-testlab

services:
  pki:
    image: sac/testlab-endpoint:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/scripts/pki.sh"]
    restart: "no"
    volumes:
      - testlabpki:/pki

  upstream:
    image: sac/testlab-endpoint:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "/app/scripts/upstream.mjs"]
    depends_on:
      pki:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - api.anthropic.test
    volumes:
      - testlabpki:/pki:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://127.0.0.1/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  device:
    image: sac/testlab-endpoint:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/scripts/device-entry.sh"]
    depends_on:
      upstream:
        condition: service_healthy
    volumes:
      - testlabpki:/pki:ro
    # The entrypoint backgrounds capture-core and then execs tail -f /dev/null to hold the container
    # open for the host driver's exec checks; init keeps PID 1 honest about reaping.
    init: true

volumes:
  # Populated by the pki one-shot before `up` completes, then mounted read-only into upstream and
  # device. Pinned so run.mjs can target it without guessing the compose project prefix.
  testlabpki:
    name: sac-testlab-testlabpki
