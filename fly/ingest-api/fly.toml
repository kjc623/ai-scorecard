# ingest-api (services/ingest-api), reachable only on the private network, by the edge.
#
# The deploy workflow passes SAC_PG_HOST and SAC_PG_USER (ingest-api.<project-ref>).
# Secrets: SAC_CA_CERT_PEM (fly/scripts/create-secrets.sh), SAC_PG_PASSWORD
# (fly/scripts/setup-database.sh).

app = "sac-preprod-ingest-api"
primary_region = "iad"

[env]
  SAC_HTTP_ADDR = "[::]:8080"
  SAC_REGION = "eastus"
  SAC_PG_DATABASE = "shadow"
  SAC_PG_PORT = "5432"
  SAC_PG_SSLMODE = "require"

[checks]
  [checks.ready]
    type = "http"
    port = 8080
    method = "get"
    path = "/readyz"
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
