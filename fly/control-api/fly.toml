# control-api (services/control-api), reachable only on the private network, by the edge and the
# dashboard.
#
# The deploy workflow passes SAC_PG_HOST, SAC_PG_USER (control-api.<project-ref>), SAC_PUBLIC_URL,
# SAC_PUBLIC_DEVICE_ENDPOINT and SAC_ENTRA_CLIENT_ID.
# Secrets: SAC_CA_CERT_PEM, SAC_CA_KEY_PEM, SAC_DIRECTORY_KEY, SAC_INTERNAL_TOKEN,
# SAC_ENTRA_CLIENT_SECRET, and the two signing keys as files (fly/scripts/create-secrets.sh);
# SAC_PG_PASSWORD (fly/scripts/setup-database.sh).

app = "sac-preprod-control-api"
primary_region = "iad"

[env]
  SAC_HTTP_ADDR = "[::]:8080"
  SAC_REGION = "eastus"
  SAC_PG_DATABASE = "shadow"
  SAC_PG_PORT = "5432"
  SAC_PG_SSLMODE = "require"
  # query-api and content-vault fetch the token keys from the issuer, on the private network.
  SAC_AUTH_ISSUER = "http://sac-preprod-control-api.internal:8080"
  SAC_CONTENT_VAULT_URL = "http://sac-preprod-content-vault.internal:8080"
  SAC_SESSION_SIGNING_KEY_FILE = "/mnt/secrets/sac-session-signing-key"
  SAC_POLICY_SIGNING_KEY_FILE = "/mnt/secrets/sac-policy-signing-key"
  SAC_POLICY_SIGNING_KEY_ID = "policy-key-1"

# A file's secret holds the file's content, base64-encoded.
[[files]]
  guest_path = "/mnt/secrets/sac-session-signing-key"
  secret_name = "SESSION_SIGNING_KEY"

[[files]]
  guest_path = "/mnt/secrets/sac-policy-signing-key"
  secret_name = "POLICY_SIGNING_KEY"

[checks]
  [checks.ready]
    type = "http"
    port = 8080
    method = "get"
    path = "/readyz"
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
