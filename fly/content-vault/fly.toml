# content-vault (services/content-vault), reachable only on the private network, by control-api,
# query-api and the dashboard.
#
# The deploy workflow passes SAC_PG_HOST, SAC_PG_USER (content-vault.<project-ref>) and
# SAC_RETRIEVAL_URL_BASE.
# Secrets: SAC_CONTENT_KEYS (fly/scripts/create-secrets.sh), SAC_PG_PASSWORD
# (fly/scripts/setup-database.sh).

app = "sac-preprod-content-vault"
primary_region = "iad"

[env]
  SAC_HTTP_ADDR = "[::]:8080"
  SAC_PG_DATABASE = "shadow"
  SAC_PG_PORT = "5432"
  SAC_PG_SSLMODE = "require"
  SAC_AUTH_ISSUER = "http://sac-preprod-control-api.internal:8080"
  SAC_AUTH_AUDIENCE = "sac-vault"

[checks]
  [checks.ready]
    type = "http"
    port = 8080
    method = "get"
    path = "/readyz"
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
