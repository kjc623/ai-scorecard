# dashboard (services/dashboard): the only browser-facing app, on the analyst hostname with a
# Fly.io-managed certificate. It forwards /onboard/* to control-api itself.
#
# The deploy workflow passes SAC_PUBLIC_URL.
# Secrets: SAC_INTERNAL_TOKEN (fly/scripts/create-secrets.sh).

app = "sac-preprod-dashboard"
primary_region = "iad"

[env]
  SAC_HTTP_ADDR = "[::]:8080"
  SAC_CONTROL_URL = "http://sac-preprod-control-api.internal:8080"
  SAC_QUERY_API_URL = "http://sac-preprod-query-api.internal:8080"
  SAC_CONTENT_VAULT_URL = "http://sac-preprod-content-vault.internal:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
