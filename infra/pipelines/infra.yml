# infra.yml — the infrastructure deployment pipeline (docs/05-platform-delivery.md §4.1, §4.4, §5.2).
#
# Four pipelines, four artefacts, four risk profiles (§4.1). This is the infrastructure one: it
# deploys the Bicep for one environment. It authenticates with a workload-federated identity
# (§5.2) — no long-lived Azure credential exists in the pipeline, and the federation subject is
# scoped to this repository, branch pattern and environment, so a pull request from a fork cannot
# obtain a token for any environment.
#
# The deployment identity is separated from the runtime identity (§5.4): this pipeline can create a
# container app, assign an identity and rewrite a firewall, and it holds no Key Vault or database
# data-plane access. Image pushes are a *different* federated identity (see policy-scan.yml's note).

name: infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, staging, prod]
        required: true
      confirm:
        description: Type the environment name to confirm a production deployment
        required: false
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  id-token: write # workload identity federation; no secret is stored
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false # an infrastructure deployment is never cancelled mid-flight

jobs:
  static-checks:
    name: static checks (no Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The same checks a reviewer runs by hand. They need no subscription, so they run before
      # anything that does.
      - run: node --test infra/tools/index.mjs
      - run: node infra/tools/check-infra.mjs

  what-if:
    name: what-if ${{ inputs.environment || 'staging' }}
    needs: static-checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    outputs:
      diff: ${{ steps.whatif.outputs.diff }}
    steps:
      - uses: actions/checkout@v4
      # azure/login with OIDC: no client secret, no stored credential (§5.2).
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: what-if
        id: whatif
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment || 'staging' }}"
          RG="rg-sac-${ENV}-eastus"
          PARAMS="infra/params/${ENV}.bicepparam"
          if [ "$ENV" = "prod" ]; then PARAMS="infra/params/prod.eastus.bicepparam"; fi
          az deployment group what-if \
            --resource-group "$RG" \
            --template-file infra/main.bicep \
            --parameters "$PARAMS" \
            --parameters postgresAdministratorLogin="${{ vars.SAC_PG_ADMIN_LOGIN }}" \
            --no-pretty-print | tee whatif.txt
          # A diff touching network, identity, encryption or ingress is drift-class and is reviewed
          # as such (§3.5) — the pipeline does not decide, it labels.
          if grep -Eiq '(publicNetworkAccess|allowSharedKeyAccess|enablePurgeProtection|ingress|identity|privateEndpoint)' whatif.txt; then
            echo "::warning::this deployment changes a network, identity, encryption or ingress property; review the diff as drift (§3.5)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: what-if-${{ inputs.environment || 'staging' }}
          path: whatif.txt

  deploy:
    name: deploy ${{ inputs.environment || 'staging' }}
    needs: what-if
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # §4.5: production takes a human approval. The environment in GitHub carries the protection
      # rule, so the gate is a review, not a script.
      - name: deploy
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment || 'staging' }}"
          if [ "$ENV" = "prod" ] && [ "${{ inputs.confirm }}" != "prod" ]; then
            echo "::error::production deployments require confirm=prod"; exit 1
          fi
          RG="rg-sac-${ENV}-eastus"
          PARAMS="infra/params/${ENV}.bicepparam"
          if [ "$ENV" = "prod" ]; then PARAMS="infra/params/prod.eastus.bicepparam"; fi
          az deployment group create \
            --resource-group "$RG" \
            --template-file infra/main.bicep \
            --parameters "$PARAMS" \
            --parameters postgresAdministratorLogin="${{ vars.SAC_PG_ADMIN_LOGIN }}" \
            --name "infra-${ENV}-$(date +%Y%m%d%H%M%S)"
      # §3.4: the migration job runs *before* the new revision receives traffic. A migration that
      # cannot run before the new code is a migration that is wrong.
      - name: start the migration job and wait
        shell: bash
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment || 'staging' }}"
          RG="rg-sac-${ENV}-eastus"
          az containerapp job start --name migration --resource-group "$RG"
          for i in $(seq 1 60); do
            state=$(az containerapp job execution list --name migration --resource-group "$RG" --query '[0].properties.status' -o tsv)
            case "$state" in
              Succeeded) echo "migration succeeded"; exit 0 ;;
              Failed) echo "::error::migration failed"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::migration did not finish within 10 minutes"; exit 1
