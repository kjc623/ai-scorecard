# A read-only table browser (pgweb) over the lab's database, on http://127.0.0.1:8089.
#
#   docker compose -f localdev/dbview.compose.yaml up -d
#   docker compose -f localdev/dbview.compose.yaml down
#
# It joins the lab's network, so the lab must be up first. It connects as the database superuser,
# which row-level security does not apply to, so it shows every tenant's rows: a lab tool, not a read
# path. The port is published on loopback only; LAB_DBVIEW_PORT moves it.

name: sac-dbview

networks:
  sac-lab:
    external: true

services:
  dbview:
    image: sosedoff/pgweb:0.16.2
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081", "--readonly"]
    environment:
      PGWEB_DATABASE_URL: postgres://postgres:sac-lab-only@postgres:5432/shadow?sslmode=disable
    ports:
      - "127.0.0.1:${LAB_DBVIEW_PORT:-8089}:8081"
    networks: [sac-lab]
    restart: unless-stopped
