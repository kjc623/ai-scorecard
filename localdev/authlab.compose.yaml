# The opt-in device-authentication lab: the real SQL stores, the real production auth modes, and
# the simulated Application Gateway in front of them (ADR 0020 decisions 1, 2 and 5).
#
#   node localdev/build.mjs --auth && node localdev/run.mjs --auth
#
# The default lab (docker-compose.yml) runs both services in memory with -dev-trust-principal, so
# control-api and ingest-api share no state and no real device credential is exercised. This file
# exists because that cannot prove enrol-then-ingest: the credential control-api issues has to be
# the credential ingest-api later verifies, and the only thing that makes them the same is the
# database and the shared CA. So this lab is deliberately a separate compose project with:
#
#   * PostgreSQL 17 with database/schema.sql applied unmodified (the real ops.* tables);
#   * control-api built with -tags sac_sql_driver and -store sql, signing leaves with the dev CA;
#   * ingest-api built with -tags sac_sql_driver and -store sql, verifying x509 and dpop against the
#     same database and the same CA;
#   * edge, the Application Gateway stand-in, terminating TLS 1.3 in passthrough mode and forwarding
#     X-Client-Cert / X-Forwarded-Proto / X-Forwarded-Host.
#
# What it needs before it starts:
#   * the images from `node localdev/build.mjs --auth` (sac/{control-api,ingest-api}:lab-auth and
#     sac/edge:lab). The tagged build needs github.com/jackc/pgx/v5 in the module cache; see the
#     build.mjs header and localdev/README.md "The module-cache precondition".
#   * key material in ./authlab/ (gitignored): run `localdev/authlab/bin/authlab pki -pki-dir
#     localdev/.authlab`, which run.mjs --auth does for you.
#
# No secret is in this file: the CA, the server key pair and the token key are generated fresh into
# .authlab/ and mounted read-only; PostgreSQL holds nothing but the lab's own schema.
#
# The identity material (task 11: control-api as the product's identity service) is generated by
# `node localdev/build.mjs --auth` into .authlab-identity/ and kept across builds: the session and
# policy signing keys reach control-api through the `authidentity` volume, staged by the one-shot
# identity-seed service; the internal token, the directory key and the stand-in IdP's client secret
# are read by compose from the env files there (env_file, which the CLI reads on the host, so no bind
# mount is involved). identity-seed also links the SAMPLE tenant to the stand-in IdP. It refuses to
# run against a database built before task 11 until backlog/11-sign-in-and-roles/MIGRATION.sql is
# applied, and control-api waits for it.
#
#   service      from a container on the network   from the host (default)   host port variable
#   postgres     postgres:5432                     localhost:55435           LAB_AUTH_PG_PORT
#   control-api  http://control-api:8080           (not published)
#   ingest-api   http://ingest-api:8080            (not published)
#   edge         https://edge:8443                 https://localhost:8443   LAB_EDGE_PORT

name: sac-authlab

networks:
  default:
    name: scorecard-authlab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: sac-lab-only
      POSTGRES_DB: shadow
    ports:
      - "${LAB_AUTH_PG_PORT:-55435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shadow"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    volumes:
      - authpgdata:/var/lib/postgresql/data

  # Built by localdev/build.mjs as sac/schema:lab (see localdev/schema/Dockerfile). An image rather
  # than a bind mount of database/schema.sql because some Docker daemons replace a file bind with an
  # empty stub; the build-time COPY is reliable and applies the repository's own schema unmodified.
  schema:
    image: sac/schema:lab
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: shadow
      PGPASSWORD: sac-lab-only
    restart: "no"

  # identity-seed — one shot, after the schema: stages control-api's session and policy signing keys
  # into the authidentity volume and links the SAMPLE tenant to the stand-in IdP (an active
  # ops.identity_connection for issuer http://oidc:8080, client sac-control, and the email domain
  # lab.test). Idempotent; it runs on every `up`. Built by build.mjs --auth as sac/authlab-identity:lab
  # from localdev/identity/. It never writes the owner's tenant.
  identity-seed:
    image: sac/authlab-identity:lab
    depends_on:
      schema:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: shadow
      PGPASSWORD: sac-lab-only
    volumes:
      - authidentity:/keys
    restart: "no"

  # control-api — the enrolment and token authority. It loads the dev CA it signs leaves with and
  # the ES256 key it signs access tokens with from the mounted material; both are file paths, which
  # --ca-cert/--ca-key/--dpop-token-key-pem already accept.
  #
  # Since task 11 it is also the product's identity service: the OIDC relying party for every tenant's
  # provider, the server-side session, the issuer of the product access tokens query-api and the vault
  # verify, the SCIM endpoint and the source of each tenant's device package and signed policy.
  control-api:
    image: sac/control-api:lab-auth
    depends_on:
      schema:
        condition: service_completed_successfully
      identity-seed:
        condition: service_completed_successfully
    command:
      - --store
      - sql
      - --dsn
      - postgres://postgres:sac-lab-only@postgres:5432/shadow?sslmode=disable
      - --ca-cert
      - /authlab/dev-ca.crt
      - --ca-key
      - /authlab/dev-ca.key
      - --dpop-token-key-pem
      - /authlab/token.key
      - --token-issuer
      - sac-authlab
      - --token-audience
      - shadow-ingest
      # The content grant path (docs/02 §5.5, §10): control-api decides, and asks the vault for the
      # object key of a granted upload.
      - --vault-url
      - http://content-vault:8080
    environment:
      # Signs the upload URL a granted device writes to; contentlab holds the other copy. A lab
      # literal, like the database password above.
      SAC_UPLOAD_SIGNING_KEY: sac-lab-only-upload-signing-key
      # The product token issuer. query-api and the vault verify exactly this `iss` and fetch the
      # JWKS from it, so it is the address they reach control-api at, not one a browser uses.
      SAC_AUTH_ISSUER: http://control-api:8080
      # Session tokens are signed with their own P-256 key, never the device token key above.
      SAC_SESSION_SIGNING_KEY_FILE: /identity/session-signing.key
      # The vendor policy key. Its public half is what installer/lab-msi.mjs pins in the lab MSI
      # (localdev/.authlab-identity/policy-signing.pub.hex), so a bundle this signs verifies on the
      # owner's device.
      SAC_POLICY_SIGNING_KEY_FILE: /identity/policy-signing.key
      # The generic release a tenant package wraps: ShadowAICapture.msi + release.json, as the
      # installer builds them. Empty until it has; the package download then says so.
      SAC_AGENT_RELEASE_DIR: /release
      # Where the lab's public surface is: the edge routes /scim/v2/*, /onboard/* and /.well-known/*
      # here. The address is the one a client on the lab network uses (the stand-in IdP is
      # reachable only there too); LAB_PUBLIC_URL overrides it.
      SAC_PUBLIC_URL: ${LAB_PUBLIC_URL:-https://edge:8443}
      # What a tenant package tells a device to enrol against: the edge as the Windows host reaches
      # it, which is where the real device runs.
      SAC_PUBLIC_DEVICE_ENDPOINT: https://127.0.0.1:${LAB_EDGE_PORT:-8443}
      # Lab only: the stand-in IdP is an http issuer on a private Docker address, which control-api's
      # outbound guard refuses everywhere else. azure/main.bicep must never pass this (a test fails
      # if it does).
      SAC_AUTH_ALLOW_INSECURE_IDP: "1"
      # The exact redirect URIs sign-in accepts: the two lab dashboards' callbacks (each dashboard
      # builds its own from its SAC_PUBLIC_URL below).
      SAC_AUTH_REDIRECT_URIS: ${LAB_AUTH_REDIRECT_URIS:-http://dashboard:8787/callback,http://dashboard-sample:8787/callback}
    env_file:
      # SAC_INTERNAL_TOKEN (the dashboards' credential for /internal/v1/auth/*) and SAC_DIRECTORY_KEY
      # (seals every *_enc column), generated by build.mjs --auth and read here on the host.
      - .authlab-identity/internal-token.env
      - .authlab-identity/directory-key.env
    volumes:
      # A named volume, populated before `up` by run.mjs from the sac/authlab-pki:lab image, rather
      # than a host-path bind: some Docker daemons present a bind as an empty stub, which is why the
      # services first reported `open /authlab/dev-ca.crt: no such file or directory`.
      - authpki:/authlab:ro
      # The two signing keys, staged by identity-seed.
      - authidentity:/identity:ro
      # The installer's output, bound rather than baked: a rebuilt MSI is served without rebuilding
      # this image. A daemon that cannot see the host path shows an empty directory, which looks the
      # same as no release built yet; compose from a shell on the Windows host, not from the harness.
      - ../installer/dist/release:/release:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # content-vault — the only component that can unwrap a content key. It mints the object key for a
  # granted upload, records the finalised object, and serves an approved retrieval. Not published
  # and not routed by the edge: internal ingress only (D7). It serves from the same database, keeps
  # its development KEK in a file on its own volume so a restart does not orphan stored content,
  # and reads stored ciphertext from contentlab.
  content-vault:
    image: sac/content-vault:lab-auth
    depends_on:
      schema:
        condition: service_completed_successfully
    # Root only so the key file can be written to a fresh named volume; the image's own user cannot.
    user: "0:0"
    command:
      - serve
      - --store
      - sql
      - --dsn
      - postgres://postgres:sac-lab-only@postgres:5432/shadow?sslmode=disable
      - --key-file
      - /keys/local-kek.json
      - --blob-ciphertext-endpoint
      - http://contentlab:8080/blob
    environment:
      # The search scope the lab's policy names, and its tier. A tenant's full_text tier is only a
      # ceiling: a scope nobody names carries disabled (docs/06 §6.3).
      CONTENT_VAULT_SCOPE_TIERS: lab=full_text
      # The lab tenant's prompt index is rebuilt from its stored objects at every start, so a change
      # to what the vault indexes reaches the prompts already stored. It is safe to repeat.
      CONTENT_VAULT_REINDEX_TENANTS: 11111111-1111-1111-1111-111111111111
      # The vault reads ciphertext with its own identity. The lab has no identity provider, so it
      # presents this shared bearer and contentlab checks it; a deployment sets SAC_BLOB_IDENTITY=
      # managed and the read carries the container app's managed-identity token instead.
      SAC_BLOB_IDENTITY: static
      SAC_BLOB_READ_CREDENTIAL: sac-lab-only-blob-read-credential
      # The vault verifies the product token query-api forwards on a content request itself, and
      # refuses a tenant or role header that disagrees with it (contract §2).
      SAC_AUTH_ISSUER: http://control-api:8080
      SAC_AUTH_AUDIENCE: sac-vault
    volumes:
      - authvaultkeys:/keys
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # contentlab — the stand-in for ciphertext storage: the edge forwards a granted upload to it, it
  # reports the upload to control-api's finaliser, and the vault reads the stored object back for
  # an approved retrieval. Not published: it has no page. Content is read in the dashboard.
  contentlab:
    image: sac/contentlab:lab
    command:
      - --control-url
      - http://control-api:8080
    environment:
      SAC_UPLOAD_SIGNING_KEY: sac-lab-only-upload-signing-key
      # The read credential the vault presents; a read without it is refused, as a real storage
      # account refuses an anonymous GET.
      SAC_BLOB_READ_CREDENTIAL: sac-lab-only-blob-read-credential
    volumes:
      - authcontent:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # aggregator — the scheduled mart rollup. It reads ingest.*, writes the mart.* usage aggregates
  # and their ops.aggregate_watermark rows, and serves only /healthz. Not published: it has no page
  # and nothing but the database talks to it. A short interval so the dashboard's aggregate pages
  # fill in seconds after the lab is started.
  aggregator:
    image: sac/aggregator:lab-auth
    depends_on:
      schema:
        condition: service_completed_successfully
    command:
      - --store
      - sql
      - --dsn
      - postgres://postgres:sac-lab-only@postgres:5432/shadow?sslmode=disable
      - --interval
      - 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # oidc — the local OpenID Connect stand-in: a real authorization-code + PKCE flow that signs RS256
  # tokens. It is to a customer's identity provider what the edge is to Application Gateway: the
  # protocol is real, the directory is a fixture. Since task 11 it is an UPSTREAM provider: control-api
  # is its one confidential client (sac-control, secret from .authlab-identity/oidc-client.env), and
  # identity-seed links it to the SAMPLE tenant only, so every account here signs into the sample
  # tenant -- the tenant is decided by control-api's issuer mapping, never by a claim this fixture
  # chooses. The owner's tenant is not linked to it (the lab never writes that tenant); its sign-in is
  # the owner's Entra tenant. Not published: a browser on the lab network reaches it by service name.
  oidc:
    image: sac/oidc:lab
    environment:
      OIDC_ISSUER: http://oidc:8080
      OIDC_API_AUDIENCE: sac-query-api
      OIDC_CLIENT_ID: sac-control
      # The directory: the sample tenant's people. `email` is the actor control-api records and the
      # domain (lab.test) is how the sign-in page finds the sample tenant; `role` is emitted in the
      # `roles` claim, which the sample connection's role_map takes as product roles. `tenant` is
      # only the stand-in's own sac_tenant claim, which control-api ignores.
      OIDC_USERS: >-
        [
          {"sub":"viewer.sample@lab.test","name":"Vera Viewer (sample)","email":"viewer.sample@lab.test","role":"viewer","tenant":"5a3c0de0-7e57-4a11-9000-0000000d3a01"},
          {"sub":"analyst.sample@lab.test","name":"Ana Analyst (sample)","email":"analyst.sample@lab.test","role":"analyst","tenant":"5a3c0de0-7e57-4a11-9000-0000000d3a01"},
          {"sub":"reader.sample@lab.test","name":"Rhea Reader (sample)","email":"reader.sample@lab.test","role":"content_reader","tenant":"5a3c0de0-7e57-4a11-9000-0000000d3a01"},
          {"sub":"admin.sample@lab.test","name":"Ada Admin (sample)","email":"admin.sample@lab.test","role":"admin","tenant":"5a3c0de0-7e57-4a11-9000-0000000d3a01"}
        ]
    env_file:
      # OIDC_CLIENT_SECRET: the same secret identity-seed sealed into the sample connection.
      - .authlab-identity/oidc-client.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s

  # query-api — the read path, and the only way a browser reaches content: it forwards the two
  # content reads to content-vault with the same bearer. It verifies the product access token the
  # dashboard forwards against control-api's JWKS (one issuer, whatever provider signed the person
  # in), and reads the tenant, the actor and the roles from its claims. Not published.
  query-api:
    image: sac/query-api:lab
    depends_on:
      schema:
        condition: service_completed_successfully
    environment:
      SAC_PG_HOST: postgres
      SAC_PG_DATABASE: shadow
      SAC_PG_USER: postgres
      SAC_PG_PASSWORD: sac-lab-only
      SAC_PG_SSLMODE: disable
      SAC_CONTENT_VAULT_URL: http://content-vault:8080
      SAC_CONTENT_SEARCH_SCOPE: lab
      # The authenticated session. SAC_DEV_TRUST_PRINCIPAL is deliberately absent: the lab uses
      # the real token path, so a read without a valid token is refused.
      SAC_AUTH_ISSUER: http://control-api:8080
      SAC_AUTH_AUDIENCE: sac-query

  # dashboard — the analyst's one page: http://127.0.0.1:8787/explore.html?transport=live. Events,
  # findings, devices and the audit trail come from query-api; prompt-text search and approved
  # content retrieval go through query-api to content-vault. Its server is a thin client of
  # control-api's identity service (task 11): sign-in, callback and token refresh go to
  # /internal/v1/auth/* with the internal token, the page holds only an opaque session cookie, and the
  # product access token it forwards is never shown to the browser. /onboard/* and /admin/v1/* are
  # forwarded to control-api too.
  #
  # This one is the OWNER's tenant, which the lab links to no identity provider (the lab never writes
  # that tenant): until the owner connects their Entra tenant, nobody can sign in here.
  dashboard:
    image: sac/dashboard:lab
    depends_on:
      - query-api
      - control-api
    environment:
      SAC_QUERY_API_URL: http://query-api:8080
      # The dev forwarder sends a minted retrieval URL straight here, never through query-api, so
      # content never transits the read path (docs/02 §11).
      SAC_CONTENT_VAULT_URL: http://content-vault:8080
      SAC_CONTROL_URL: http://control-api:8080
      # The origin the sign-in callback returns to. A browser completes a lab sign-in only on the lab
      # network (the stand-in IdP is reachable only there), so the default is the service name;
      # LAB_DASHBOARD_PUBLIC_URL overrides it.
      SAC_PUBLIC_URL: ${LAB_DASHBOARD_PUBLIC_URL:-http://dashboard:8787}
      # Pin this dashboard to the owner's tenant: a token for another tenant is refused here, so
      # the sample dashboard cannot show the owner's data even if a sign-in is misdirected.
      SAC_DASHBOARD_TENANT: 11111111-1111-1111-1111-111111111111
    env_file:
      # SAC_INTERNAL_TOKEN, the credential control-api's /internal/v1/auth/* requires.
      - .authlab-identity/internal-token.env
    ports:
      - "127.0.0.1:${LAB_DASHBOARD_PORT:-8787}:8787"

  # dashboard-sample — the same pages over the same query-api, for the sample tenant that
  # localdev/tools/simulate-devices.mjs writes to by default: http://127.0.0.1:8788. Simulated
  # devices belong there and not in the tenant above, which holds what a real enrolled device sent;
  # a fleet of invented devices beside one real one makes every count on the real page untrue.
  #
  # Its people sign in through the stand-in IdP: "Work email -> Continue" with any *.sample@lab.test
  # account finds the sample tenant by its email domain (identity-seed).
  dashboard-sample:
    image: sac/dashboard:lab
    depends_on:
      - query-api
      - control-api
    environment:
      SAC_QUERY_API_URL: http://query-api:8080
      SAC_CONTENT_VAULT_URL: http://content-vault:8080
      SAC_CONTROL_URL: http://control-api:8080
      SAC_PUBLIC_URL: ${LAB_DASHBOARD_SAMPLE_PUBLIC_URL:-http://dashboard-sample:8787}
      SAC_DASHBOARD_TENANT: 5a3c0de0-7e57-4a11-9000-0000000d3a01
    env_file:
      - .authlab-identity/internal-token.env
    ports:
      - "127.0.0.1:${LAB_DASHBOARD_SAMPLE_PORT:-8788}:8787"

  # ingest-api — the write path. It re-verifies every credential against ops.* and the same CA the
  # edge forwards from, so a certificate the dev CA did not sign is refused here and not trusted by
  # the edge. The deployment vocabulary (SAC_AUTH_MODES, SAC_TLS_CLIENT_CERT_HEADER, SAC_DPOP_*) is
  # set as the deployment sets it; only the CA and token key are file paths to the mounted material.
  ingest-api:
    image: sac/ingest-api:lab-auth
    depends_on:
      schema:
        condition: service_completed_successfully
    command:
      - --store
      - sql
      - --dsn
      - postgres://postgres:sac-lab-only@postgres:5432/shadow?sslmode=disable
      - --tls-client-ca
      - /authlab/dev-ca.crt
      - --dpop-token-public-pem
      - /authlab/token.pub.pem
    environment:
      SAC_AUTH_MODES: x509,dpop
      SAC_TLS_CLIENT_CERT_HEADER: X-Client-Cert
      SAC_DPOP_ISSUER: sac-authlab
      SAC_DPOP_AUDIENCE: shadow-ingest
    volumes:
      # A named volume, populated before `up` by run.mjs from the sac/authlab-pki:lab image, rather
      # than a host-path bind: some Docker daemons present a bind as an empty stub, which is why the
      # services first reported `open /authlab/dev-ca.crt: no such file or directory`.
      - authpki:/authlab:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # edge — the Application Gateway stand-in. It terminates TLS 1.3, requests a client certificate
  # without requiring one, forwards the presented chain in X-Client-Cert, and reverse-proxies by
  # path. It has no tenant, device or credential knowledge.
  edge:
    image: sac/edge:lab
    depends_on:
      control-api:
        condition: service_healthy
      ingest-api:
        condition: service_healthy
    ports:
      - "${LAB_EDGE_PORT:-8443}:8443"
    command:
      - --addr
      - 0.0.0.0:8443
      - --health-addr
      - 0.0.0.0:8081
      - --tls-cert
      - /authlab/edge-server.crt
      - --tls-key
      - /authlab/edge-server.key
      - --client-ca
      - /authlab/dev-ca.crt
      - --control-url
      - http://control-api:8080
      - --ingest-url
      - http://ingest-api:8080
      - --content-url
      - http://contentlab:8080
    volumes:
      # A named volume, populated before `up` by run.mjs from the sac/authlab-pki:lab image, rather
      # than a host-path bind: some Docker daemons present a bind as an empty stub, which is why the
      # services first reported `open /authlab/dev-ca.crt: no such file or directory`.
      - authpki:/authlab:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  authpgdata:
  # control-api's session and policy signing keys, staged from sac/authlab-identity:lab by
  # identity-seed on every `up`. The material itself lives in .authlab-identity/ and is kept.
  authidentity:
  # The vault's development KEK and the stored ciphertext. Both go with `--down`, together with
  # the database that references them.
  authvaultkeys:
  authcontent:
  # Populated before `up` by run.mjs --auth from sac/authlab-pki:lab (which bakes localdev/.authlab
  # in with a build-time COPY), then mounted read-only into the three services. Pinned so run.mjs
  # can target it without guessing the compose project prefix.
  authpki:
    name: sac-authlab-authpki
