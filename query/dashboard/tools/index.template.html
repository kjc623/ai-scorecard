<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow AI Capture — dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Shadow AI Capture</h1>
        <button type="button" id="menu" class="menu" aria-label="Menu"><span></span><span></span></button>
      </div>
      <nav id="nav" class="nav" aria-label="Screens"></nav>
      <div class="side-foot">
        <div class="seg seg-small" id="source" role="group" aria-label="Data source"></div>
        <button type="button" id="theme" class="icon-btn" aria-label="Switch between light and dark" title="Light or dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="content">
    <main id="app" class="app" aria-live="polite">
      <p class="loading">Loading the dashboard…</p>
    </main>
    <footer class="app-foot">
      <p><a href="#unavailable">Known gaps</a></p>
    </footer>
  </div>
</div>
