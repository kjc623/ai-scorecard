<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore | Shadow AI Capture</title>
<link rel="stylesheet" href="explore.css">
</head>
<body>
<header class="x-top">
  <div class="x-brand">
    <span class="x-brand-name">Shadow AI Capture</span>
    <h1>Explore</h1>
  </div>
  <div class="x-top-side">
    <div class="x-sample" id="x-sample">
      <label for="x-scenario">Sample data, state</label>
      <select id="x-scenario" class="x-select"></select>
    </div>
    <span class="x-live" id="x-live" hidden>Live query API</span>
    <a class="x-top-link" href="index.html">All screens</a>
  </div>
</header>

<div id="x-strip"></div>

<main class="x-main">
  <section class="x-search" aria-label="Search">
    <div class="x-seg" id="x-datasets" role="group" aria-label="What to search"></div>
    <form id="x-form" class="x-form" autocomplete="off">
      <div class="x-form-query">
        <label class="x-label" for="x-query">Filter query</label>
        <input id="x-query" class="x-input x-query" type="text" spellcheck="false" autocapitalize="off"
               placeholder="tool:claude_web action:blocked" aria-describedby="x-problems">
      </div>
      <div class="x-form-window">
        <span class="x-label" id="x-window-label">Window</span>
        <div class="x-seg" id="x-window" role="group" aria-labelledby="x-window-label"></div>
      </div>
      <button type="submit" class="x-btn x-btn-primary">Search</button>
    </form>
    <div class="x-suggest" id="x-suggest"></div>
    <div id="x-problems" role="alert"></div>
    <form id="x-text-form" class="x-form x-text-form" autocomplete="off">
      <div class="x-form-query">
        <label class="x-label" for="x-text-query">Search prompt text</label>
        <input id="x-text-query" class="x-input" type="text" spellcheck="false"
               placeholder="words from a prompt, or &quot;an exact phrase&quot;" aria-describedby="x-text">
      </div>
      <button type="submit" class="x-btn">Search text</button>
    </form>
    <div id="x-text" aria-live="polite"></div>
  </section>

  <div class="x-body" id="x-body">
    <button type="button" class="x-btn x-btn-quiet x-rail-toggle" data-act="rail">Filters</button>
    <aside class="x-rail" id="x-rail" aria-label="Filters"></aside>
    <section class="x-results" aria-label="Results">
      <div id="x-summary" class="x-summary" aria-live="polite"></div>
      <div id="x-results" class="x-results-body"></div>
    </section>
    <aside class="x-detail" id="x-detail" aria-labelledby="x-detail-title" hidden></aside>
  </div>
</main>

<!--
  explore.html is generated by tools/build-index.mjs: the module graph from src/ is inlined below as
  one module block so the page opens directly from the filesystem. Edit src/*.js, then run
  `node tools/build-index.mjs`.
-->
<!--__INLINE_MODULE__-->
</body>
</html>
