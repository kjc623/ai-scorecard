// ─── src/render.js ─────────────────────────────────────────────────────
// render.js — view models to HTML. Pure: no DOM access, no fetching, no state.
//
// Every string that came from the API is escaped here. The dashboard renders tool fingerprints,
// rule titles, user references and case references, all of which are attacker-influenced text as
// far as the browser is concerned, and none of which is allowed to become markup.
//
// The one visual rule that matters more than the rest: a suppressed value renders as a hatched
// marker carrying k, and a genuine zero renders as `0`. They are different CSS classes fed by
// different value kinds, so a stylesheet change cannot merge them by accident either.




function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Render one value that already has a kind. There is no branch here that turns `suppressed` into a
 * number, and none that turns a number into a suppression.
 */
function renderValue(value) {
  if (!value || typeof value !== 'object') return '<span class="v-absent">—</span>';
  switch (value.kind) {
    case 'number':
      return `<span class="v-number">${escapeHtml(value.text ?? formatCount(value.value))}</span>`;
    case 'floor':
      return `<span class="v-floor" title="A floor: ${escapeHtml(String(value.suppressedCells ?? 0))} cell(s) suppressed">≥ ${escapeHtml(String(value.text ?? formatCount(value.value)).replace(/^≥\s*/, ''))}</span>`;
    case 'suppressed':
      return `<span class="v-suppressed" title="Fewer than k = ${escapeHtml(String(value.k ?? 5))} distinct subjects">suppressed<span class="v-k">k=${escapeHtml(String(value.k ?? 5))}</span></span>`;
    case 'vocab':
      return `<span class="v-vocab v-vocab-${escapeHtml(String(value.text).replace(/[^a-z_]/gi, ''))}">${escapeHtml(value.text)}</span>`;
    case 'absent':
    default:
      return '<span class="v-absent" title="Not carried by this response">—</span>';
  }
}

const MEASURE_KINDS = Object.freeze(['measure', 'measure-bytes', 'measure-score', 'count']);

/**
 * A data bar behind a number: the same value, drawn. It is scaled to the largest publishable
 * value in its column, so a suppressed cell has no length to read off.
 */
function dataBar(raw, max) {
  if (!(max > 0) || !(Number(raw) > 0)) return '';
  return `<span class="cell-bar" style="--w:${Math.max(2, Math.round((Number(raw) / max) * 100))}" aria-hidden="true"></span>`;
}

function renderCell(row, column, max = 0) {
  const { key, kind } = column;
  const raw = row[key];
  if (kind === 'measure' || kind === 'measure-bytes' || kind === 'measure-score') {
    if (row.result_state === 'suppressed') return renderValue({ kind: 'suppressed', k: row.k });
    if (raw === null || raw === undefined) return renderValue({ kind: 'absent' });
    if (kind === 'measure-bytes') return `${dataBar(raw, max)}<span class="v-number">${escapeHtml(formatBytes(Number(raw)))}</span>`;
    if (kind === 'measure-score') return `<span class="v-number">${escapeHtml(formatScore(Number(raw)))}</span>`;
    return `${dataBar(raw, max)}<span class="v-number">${escapeHtml(formatCount(Number(raw)))}</span>`;
  }
  if (kind === 'count') {
    return raw === null || raw === undefined ? renderValue({ kind: 'absent' }) : `${dataBar(raw, max)}<span class="v-number">${escapeHtml(formatCount(Number(raw)))}</span>`;
  }
  if (kind === 'instant') {
    return raw ? `<span class="v-time">${escapeHtml(formatInstant(raw))}</span>` : renderValue({ kind: 'absent' });
  }
  if (kind === 'device-clock') {
    return raw
      ? `<span class="v-time v-device-clock" title="The device clock: possibly skewed, never normalised into server time">${escapeHtml(formatInstant(raw))}</span>`
      : renderValue({ kind: 'absent' });
  }
  if (kind === 'seconds') {
    return raw === null || raw === undefined ? renderValue({ kind: 'absent' }) : `<span class="v-number">${escapeHtml(formatCount(Number(raw)))} s</span>`;
  }
  if (kind === 'status') {
    // A state said in plain words. The vocabulary value it stands for stays in the markup.
    const value = String(raw ?? 'unknown');
    return `<span class="v-vocab v-vocab-${escapeHtml(value.replace(/[^a-z_]/gi, ''))}" title="${escapeHtml(value)}">${escapeHtml(row[`${key}_text`] ?? value)}</span>`;
  }
  if (kind === 'ago') {
    return raw
      ? `<span class="v-text" title="${escapeHtml(formatInstant(raw))}">${escapeHtml(row[`${key}_ago`] ?? formatInstant(raw))}</span>`
      : '<span class="v-absent">Never</span>';
  }
  if (kind === 'device-name') {
    // The hostname is the device name; the UUID is the identity and stays available on hover, and
    // is the fallback label when no hostname was recorded (a 'hashed' tenant, or an old device).
    const uuid = row.device ? String(row.device) : '';
    if (raw === null || raw === undefined || raw === '') {
      return uuid
        ? `<span class="v-text" title="${escapeHtml(uuid)}"><span class="v-mono">${escapeHtml(uuid.slice(0, 8))}…</span></span>`
        : renderValue({ kind: 'absent' });
    }
    return `<span class="v-text" title="${escapeHtml(uuid)}">${escapeHtml(String(raw))}</span>`;
  }
  if (kind === 'link') {
    return raw ? `<a class="cell-link" href="${escapeHtml(String(raw))}">${escapeHtml(column.linkLabel ?? 'Open')}</a>` : '';
  }
  if (kind === 'vocab') {
    // A vocabulary value is rendered even when it is a value people forget: `unknown` and
    // `never_reported` are answers, and a blank would be indistinguishable from a missing field.
    return raw === null || raw === undefined ? '<span class="v-vocab v-vocab-unknown">unknown</span>' : renderValue({ kind: 'vocab', text: raw });
  }
  if (raw === null || raw === undefined) return renderValue({ kind: 'absent' });
  // The tool column resolves the raw, behaviour-derived fingerprint to a name at read time. Both
  // are shown: the name is what a person reads, and the fingerprint is the stable identity behind
  // it, so an "Unrecognised tool" is never mistaken for a tool the product knows and merely
  // labelled badly (brief §2, C8). A row that carries no tool_name falls back to the fingerprint.
  if (key === 'tool') {
    const fingerprint = String(raw);
    const name = row.tool_name ? String(row.tool_name) : fingerprint;
    if (name === fingerprint) return `<span class="v-text v-mono" title="Tool fingerprint">${escapeHtml(fingerprint)}</span>`;
    return `<span class="v-text" title="Tool fingerprint ${escapeHtml(fingerprint)}">${escapeHtml(name)}</span>`
      + ` <span class="v-mono v-tool-fp">${escapeHtml(fingerprint)}</span>`;
  }
  // A person reference opens that person's series: the one screen that takes it.
  if (key === 'subject') return `<a class="cell-link" href="#person?subject=${encodeURIComponent(String(raw))}">${escapeHtml(String(raw))}</a>`;
  return `<span class="v-text">${escapeHtml(String(raw))}</span>`;
}

/**
 * How the rows on screen split across a vocabulary column, drawn as one segmented bar. It counts
 * the rows this response carried and says so; it is a picture of the table beneath it, not a
 * figure for the fleet.
 */
function renderBreakdowns(table) {
  if (table.rows.length < 2) return '';
  const blocks = [];
  for (const column of table.columns) {
    if (column.kind !== 'vocab' || blocks.length >= 3) continue;
    const counts = new Map();
    for (const { row } of table.rows) {
      const value = row[column.key] === null || row[column.key] === undefined ? 'unknown' : String(row[column.key]);
      counts.set(value, (counts.get(value) ?? 0) + 1);
    }
    if (counts.size < 2 || counts.size > 6) continue;
    const parts = [...counts].sort((a, b) => b[1] - a[1]);
    const cls = (value) => `v-vocab-${escapeHtml(value.replace(/[^a-z_]/gi, ''))}`;
    blocks.push(
      `<div class="dist"><span class="dist-label">${escapeHtml(column.label)}</span>`
      + `<div class="dist-bar" role="img" aria-label="${escapeHtml(parts.map(([v, n]) => `${v}: ${n}`).join(', '))}">`
      + parts.map(([value, n], i) => `<span class="dist-seg dist-c${i} ${cls(value)}" style="flex-grow:${n}" title="${escapeHtml(value)}: ${n} of ${table.rows.length} rows shown"></span>`).join('')
      + '</div><ul class="dist-legend">'
      + parts.map(([value, n], i) => `<li><span class="dist-dot dist-c${i} ${cls(value)}" aria-hidden="true"></span>${escapeHtml(value)}<span class="dist-n">${n}</span></li>`).join('')
      + '</ul></div>',
    );
  }
  return blocks.length > 0 ? `<div class="dists">${blocks.join('')}</div>` : '';
}

function renderTable(table) {
  const numeric = (c) => MEASURE_KINDS.includes(c.kind);
  const maxima = new Map(table.columns.filter(numeric).map((c) => [
    c.key,
    Math.max(0, ...table.rows.map(({ row }) => (row.result_state === 'suppressed' ? 0 : Number(row[c.key]) || 0))),
  ]));
  const head = table.columns.map((c) => `<th scope="col"${numeric(c) ? ' class="num"' : ''}>${escapeHtml(c.label)}</th>`).join('');
  const body = table.rows.map(({ row }) => {
    const cells = table.columns.map((c) => `<td${numeric(c) ? ' class="num"' : ''}>${renderCell(row, c, maxima.get(c.key))}</td>`).join('');
    if (row.result_state === 'suppressed') return `<tr class="row-suppressed">${cells}</tr>`;
    // A row that names a submission opens it: the event screen is reached from a row, not typed.
    if (typeof row.submission_id === 'string' && row.submission_id !== '') {
      const hint = row.received_at ? `&received_at_hint=${encodeURIComponent(row.received_at)}` : '';
      return `<tr class="row-link" tabindex="0" data-href="#event?submission_id=${encodeURIComponent(row.submission_id)}${hint}">${cells}</tr>`;
    }
    return `<tr>${cells}</tr>`;
  }).join('');
  const empty = table.rows.length === 0
    ? `<tr class="row-empty"><td colspan="${table.columns.length}">${escapeHtml(table.emptyText ?? 'No rows.')}</td></tr>`
    : '';
  const note = table.suppressedCells > 0
    ? `<p class="table-note"><span class="legend-swatch" aria-hidden="true"></span>${escapeHtml(String(table.suppressedCells))} suppressed<span class="sr"> cell(s) in this table: a hatched cell means there was something and the number is withheld, never that the value is zero.</span></p>`
    : '';
  const count = table.rows.length > 0 ? `<span class="block-count">${table.rows.length}</span>` : '';
  const more = table.href ? `<a class="block-link" href="${escapeHtml(table.href)}">View all</a>` : '';
  return `<section class="table-block card"><div class="card-core"><header class="block-head"><h3>${escapeHtml(table.title)}</h3>${count}${note}${more}</header>`
    + (table.breakdowns === false ? '' : renderBreakdowns(table))
    + `<div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}${empty}</tbody></table></div></div></section>`;
}

/**
 * A series. A suppressed bucket renders as a hatched column, not as a zero-height one, and the
 * axis is scaled to the largest publishable value so a suppressed bucket cannot be read off the
 * chart's proportions.
 */
function renderSeries(series) {
  if (!series) return '';
  const open = (inner) => `<section class="series-block card"><div class="card-core"><header class="block-head"><h3>${escapeHtml(series.title)}</h3></header>${inner}</div></section>`;
  if (series.unavailable) return open(`<p class="series-unavailable">No chart: ${escapeHtml(series.reason)}</p>`);
  if (series.points.length === 0) return open('<p class="series-unavailable">No points.</p>');
  const max = Math.max(1, ...series.points.map((p) => (p.value.kind === 'number' || p.value.kind === 'floor' ? p.value.value : 0)));
  const bars = series.points.map((p, i) => {
    const label = formatInstant(p.bucket).slice(0, 10) || 'total';
    const delay = `--i:${Math.min(i, 24)}`;
    if (p.value.kind === 'floor') {
      return `<div class="bar bar-floor" style="${delay}" tabindex="0" data-tip="${escapeHtml(label)} · ≥ ${escapeHtml(formatCount(p.value.value))} (${escapeHtml(String(p.value.suppressedCells))} suppressed)"><span class="bar-fill" style="--h:100"></span><span class="bar-label">${escapeHtml(label.slice(5))}</span></div>`;
    }
    const height = Math.max(1, Math.round((p.value.value / max) * 100));
    return `<div class="bar" style="${delay}" tabindex="0" data-tip="${escapeHtml(label)} · ${escapeHtml(formatCount(p.value.value))}"><span class="bar-fill" style="--h:${height}"></span><span class="bar-label">${escapeHtml(label.slice(5))}</span></div>`;
  }).join('');
  const hasFloor = series.points.some((p) => p.value.kind === 'floor');
  const axis = `<div class="axis" aria-hidden="true"><span>${escapeHtml(formatCount(max))}</span><span>${escapeHtml(formatCount(Math.round(max / 2)))}</span><span>0</span></div>`;
  return open(
    `<div class="chart">${axis}<div class="bars${series.points.length <= 3 ? ' bars-few' : ''}">${bars}</div></div>`
    + (hasFloor ? '<p class="series-note"><span class="legend-swatch" aria-hidden="true"></span>Hatched columns are floors, not zeroes.</p>' : ''),
  );
}

function renderBanner(banner) {
  return `<div class="banner banner-${escapeHtml(banner.level)}" role="status">`
    + `<strong>${escapeHtml(banner.title)}</strong><span>${escapeHtml(banner.text)}</span></div>`;
}

/** A tile's two-part split: one bar and its two counts, sized by the counts themselves. */
function renderSplit(split) {
  if (!Array.isArray(split) || split.length === 0) return '';
  return '<div class="dist-bar tile-split" aria-hidden="true">'
    + split.map((part) => `<span class="dist-seg v-vocab-${escapeHtml(part.key)}" style="flex-grow:${Math.max(0, Number(part.count) || 0)}"></span>`).join('')
    + '</div><ul class="dist-legend">'
    + split.map((part) => `<li><span class="dist-dot v-vocab-${escapeHtml(part.key)}" aria-hidden="true"></span>${escapeHtml(part.label)}<span class="dist-n">${escapeHtml(formatCount(part.count))}</span></li>`).join('')
    + '</ul>';
}

function renderTile(t) {
  const tag = t.href ? 'a' : 'div';
  return `<${tag} class="tile card${t.href ? ' tile-link' : ''}"${t.href ? ` href="${escapeHtml(t.href)}"` : ''}><div class="card-core"><span class="tile-label">${escapeHtml(t.label)}</span>`
    + `<span class="tile-value">${renderValue(t.value)}</span>`
    + renderSplit(t.split)
    + (t.note ? `<span class="tile-note">${escapeHtml(t.note)}</span>` : '')
    + `</div></${tag}>`;
}

function renderNeeds(view) {
  return `<section class="needs"><h2>${escapeHtml(view.title)}</h2><p>${escapeHtml(view.subtitle ?? 'This screen needs an input before it can ask its question.')}</p></section>`;
}

/**
 * The Users search bar. It is the one input a reader can type: there is no list of people to pick
 * from, so a person is reached by reference and shown on the same screen.
 */
function renderSearch(search) {
  if (!search) return '';
  return '<form class="needs-form search-form" data-screen="person" role="search">'
    + `<input name="subject" type="search" aria-label="User reference" placeholder="Enter a user reference, such as u_4f21" value="${escapeHtml(search.value ?? '')}" autocomplete="off" spellcheck="false">`
    + '<button type="submit">Search</button></form>';
}

/** A screen's filters: one labelled row of links each, above the table they narrow. */
function renderFilters(filters) {
  if (!Array.isArray(filters) || filters.length === 0) return '';
  return `<div class="filter-bar">${filters.map((f) => (
    `<div class="filter"><span class="filter-label">${escapeHtml(f.label)}</span>${renderPresets(f, f.label)}</div>`
  )).join('')}</div>`;
}

/** A segmented control of links: the window presets, or a screen's own switch. The choice is in the address. */
function renderPresets(presets, label = 'Window') {
  if (!presets || !Array.isArray(presets.items) || presets.items.length === 0) return '';
  return `<div class="seg" role="group" aria-label="${escapeHtml(presets.label ?? label)}">${presets.items.map((p) => (
    `<a class="seg-item" href="${escapeHtml(p.href)}"${p.id === presets.current ? ' aria-current="true"' : ''}>${escapeHtml(p.label)}</a>`
  )).join('')}</div>`;
}

/** A whole screen. Degraded coverage and stale data are said by the banners under the title. */
function renderScreen(view, shell = {}) {
  if (view.needsInput && !view.search) return renderNeeds(view);
  const banners = (view.banners ?? []).map(renderBanner).join('');
  const tiles = (view.tiles ?? []).length > 0 ? `<div class="tiles">${view.tiles.map(renderTile).join('')}</div>` : '';
  const tables = (view.tables ?? []).map(renderTable).join('');
  const filters = renderFilters(view.filters);
  const series = (view.series ?? []).map(renderSeries).join('');
  // The reading notes are one click away rather than under every table: they matter, and they are
  // the same on every visit.
  const notes = (view.notes ?? []).length > 0
    ? `<details class="notes"><summary>About this data<span class="notes-count">${view.notes.length}</span></summary><ul>${view.notes.map((n) => `<li>${escapeHtml(n)}</li>`).join('')}</ul></details>`
    : '';
  const header = '<header class="screen-head"><div class="screen-title">'
    + (shell.eyebrow ? `<span class="eyebrow">${escapeHtml(shell.eyebrow)}</span>` : '')
    + `<h2>${escapeHtml(view.title)}</h2>`
    + (view.question ? `<p class="question">${escapeHtml(view.question)}</p>` : '')
    + (view.subtitle ? `<p class="subtitle">${escapeHtml(view.subtitle)}</p>` : '')
    + '</div><div class="screen-tools"><div class="screen-switches">'
    + renderPresets(shell.switch)
    + renderPresets(shell.presets)
    + '</div>'
    + (view.sourceLabel ? `<p class="source" title="Where this screen reads from">Source <code>${escapeHtml(view.sourceLabel)}</code></p>` : '')
    + '</div></header>';
  return `<article class="screen">${header}${renderSearch(view.search)}${banners}${tiles}${series}${filters}${tables}${notes}</article>`;
}

/** Thin-line icons for the navigation: one stroke weight, no fills. */
const NAV_ICONS = Object.freeze({
  overview: '<circle cx="12" cy="12" r="8.5"/><path d="M12 12 16.5 8"/><path d="M12 3.5v2M20.5 12h-2M5.5 12h-2"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  usage: '<path d="M4 19.5V10M9.5 19.5v-15M15 19.5v-7M20.5 19.5V7"/>',
  review: '<path d="M5 4.5h14v12H9l-4 3z"/><path d="M9 9h6M9 12.5h4"/>',
  collection: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M9 20h6M12 16v4"/>',
  governance: '<path d="M12 3.5 5 6.5v5c0 4.3 2.9 7.4 7 9 4.1-1.6 7-4.7 7-9v-5z"/><path d="m9.2 12 2 2 3.6-4"/>',
  unavailable: '<circle cx="12" cy="12" r="8.5"/><path d="M6 18 18 6"/>',
  developer: '<path d="m8.5 8-4 4 4 4M15.5 8l4 4-4 4M13.5 5.5l-3 13"/>',
});

function navIcon(name) {
  const body = NAV_ICONS[name];
  return body ? `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>` : '';
}

/**
 * The navigation, as the contents of the page's nav element. An item with no group is a top-level
 * link; the rest sit under their group, which folds. A group holding the current screen is open,
 * so the reader is never somewhere the navigation does not show.
 */
function renderNav(items, current, options = {}) {
  const collapsed = new Set(options.collapsed ?? []);
  const link = (item, nested) => {
    const active = item.id === current ? ' class="active" aria-current="page"' : '';
    const title = item.question ? ` title="Question ${escapeHtml(String(item.question))}"` : '';
    return `<a href="${escapeHtml(item.href ?? `#${item.id}`)}"${active}${title}>${nested ? '' : navIcon(item.icon)}<span>${escapeHtml(item.label)}</span></a>`;
  };
  const out = [];
  const groups = new Map();
  for (const item of items) {
    if (!item.group) {
      out.push({ html: link(item, false) });
      continue;
    }
    if (!groups.has(item.group)) {
      const entry = { group: item.group, icon: item.groupIcon, members: [] };
      groups.set(item.group, entry);
      out.push(entry);
    }
    groups.get(item.group).members.push(item);
  }
  return out.map((entry) => {
    if (entry.html) return entry.html;
    const holdsCurrent = entry.members.some((m) => m.id === current);
    const open = holdsCurrent || !collapsed.has(entry.group);
    return `<details class="nav-group" data-group="${escapeHtml(entry.group)}"${open ? ' open' : ''}>`
      + `<summary>${navIcon(entry.icon)}<span>${escapeHtml(entry.group)}</span><svg class="nav-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></summary>`
      + `<div class="nav-items">${entry.members.map((m) => link(m, true)).join('')}</div></details>`;
  }).join('');
}

/** The state gallery: pick a scenario, see every screen render it. */
function renderGallery(scenarios, current) {
  return `<section class="gallery"><h3>State gallery</h3>`
    + `<p>Every result state the API documents, rendered by the same code the screens use. Pick one to force it across the dashboard.</p>`
    + `<div class="gallery-items">${scenarios.map((s) => `<a class="gallery-item${s.id === current ? ' active' : ''}" href="#gallery/${escapeHtml(s.id)}">${escapeHtml(s.label)}</a>`).join('')}</div>`
    + '</section>';
}

/** The reason vocabulary, rendered so an absent reason cannot look like a blank. */
function renderGapReasons(coverage) {
  const present = coverage?.gap_reasons ?? {};
  return `<ul class="gap-list">${GAP_REASONS.map((reason) => {
    const count = present[reason];
    return `<li class="${count === undefined ? 'gap-none' : 'gap-some'}">${escapeHtml(reason)}: ${count === undefined ? 'none recorded' : escapeHtml(formatCount(count))}</li>`;
  }).join('')}</ul>`;
}

// ─── src/shell.js ──────────────────────────────────────────────────────
// shell.js — what every page of the dashboard shares around its content: the navigation's
// shape, the reader's stored preferences, and the controls in the navigation panel.
//
// The dashboard (app.js) and the Explore page (explore-app.js) both boot through this, so the
// sidebar is one thing: the same groups, the same folding, the same theme and data-source switch.

/**
 * The navigation: five destinations, with the three usage screens under one group. Every other
 * screen is reached from a row, a switch on one of these, or the footer.
 */
const NAV_GROUPS = Object.freeze([
  { group: null, icon: 'overview', ids: ['posture'], labels: { posture: 'Overview' } },
  { group: 'Usage', icon: 'usage', ids: ['tools', 'teams', 'person'], labels: { tools: 'Tools & data classes', teams: 'Teams', person: 'Users' } },
  { group: null, icon: 'collection', ids: ['devices'], labels: { devices: 'Devices' } },
  { group: null, icon: 'governance', ids: ['audit'], labels: { audit: 'Audit trail' } },
]);

const NAV_FOLDED = Object.freeze(NAV_GROUPS.filter((g) => g.folded).map((g) => g.group));

/**
 * The navigation as renderNav takes it. `page` prefixes each screen link, so a sibling page links
 * back into the dashboard; the Explore page sits second, as a top-level link, on both.
 */
function shellNavItems({ page = '', query = '', questionOf = () => null } = {}) {
  const items = NAV_GROUPS.flatMap(({ group, icon, ids, labels }) => ids.map((id) => ({
    id, label: labels[id], question: questionOf(id), group, icon, groupIcon: icon, href: `${page}#${id}`,
  })));
  return [
    items[0],
    { id: 'explore', label: 'Search', href: `explore.html${query}`, icon: 'search', group: null },
    ...items.slice(1),
  ];
}

/** The group a screen sits under, for the eyebrow above its title. */
function groupOf(screenId) {
  return NAV_GROUPS.find((g) => g.ids.includes(screenId))?.group ?? null;
}

/** Local preferences. Storage can be unavailable (a private window, a file:// page): then nothing is kept. */
function readPref(document, key, fallback) {
  try {
    return document.defaultView?.localStorage?.getItem(key) ?? fallback;
  } catch {
    return fallback;
  }
}

function writePref(document, key, value) {
  try {
    document.defaultView?.localStorage?.setItem(key, value);
  } catch {
    // Not kept. The page still works.
  }
}

/**
 * The shell's own controls: which navigation groups are folded, the theme, the data-source switch,
 * the mobile menu, and a row that opens the record it names. Every lookup is optional, so a test
 * document with none of these elements boots the same way.
 */
function wireShell({ document, live, collapsed }) {
  const el = (id) => (typeof document.getElementById === 'function' ? document.getElementById(id) : null);
  const html = document.documentElement;

  // Theme: follow the system unless the reader chose. The choice is the only thing stored.
  const theme = readPref(document, 'sac.theme', '');
  if (html?.dataset && (theme === 'light' || theme === 'dark')) html.dataset.theme = theme;

  const source = el('source');
  if (source) {
    source.innerHTML = `<a class="seg-item" href="${live ? '.' : '#'}"${live ? '' : ' aria-current="true"'} data-source="sample">Sample</a>`
      + `<a class="seg-item" href="${live ? '#' : '?transport=live'}"${live ? ' aria-current="true"' : ''} data-source="live">Live</a>`;
  }

  if (typeof document.addEventListener !== 'function') return;

  // A folded group stays folded across screens and visits.
  document.addEventListener('toggle', (event) => {
    const group = event.target?.dataset?.group;
    if (!group) return;
    if (event.target.open) collapsed.delete(group);
    else collapsed.add(group);
    writePref(document, 'sac.nav.collapsed', [...collapsed].join('|'));
  }, true);

  document.addEventListener('click', (event) => {
    const target = event.target;
    if (typeof target?.closest !== 'function') return;
    if (target.closest('#theme')) {
      const dark = html.dataset.theme
        ? html.dataset.theme === 'dark'
        : document.defaultView?.matchMedia?.('(prefers-color-scheme: dark)').matches;
      html.dataset.theme = dark ? 'light' : 'dark';
      writePref(document, 'sac.theme', html.dataset.theme);
      return;
    }
    if (target.closest('#menu')) {
      document.body.classList.toggle('menu-open');
      return;
    }
    // Choosing a destination closes the mobile menu.
    if (target.closest('.nav a')) document.body.classList.remove('menu-open');
    const sourceLink = target.closest('[data-source]');
    if (sourceLink && sourceLink.getAttribute('aria-current') !== 'true') {
      // Switching data source reloads the page on the same screen.
      event.preventDefault();
      const base = document.location.pathname;
      document.location.assign(`${base}${sourceLink.dataset.source === 'live' ? '?transport=live' : ''}${document.location.hash}`);
      return;
    }
    const row = target.closest('tr[data-href]');
    if (row && !target.closest('a, button')) document.location.hash = row.dataset.href;
  });

  document.addEventListener('keydown', (event) => {
    const row = event.target?.closest?.('tr[data-href]');
    if (row && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      document.location.hash = row.dataset.href;
    }
    if (event.key === 'Escape') document.body?.classList?.remove('menu-open');
  });
}

/** The navigation groups the reader has folded; the rarely needed ones start folded. */
function readCollapsed(document) {
  return new Set(String(readPref(document, 'sac.nav.collapsed', NAV_FOLDED.join('|'))).split('|').filter(Boolean));
}

// ─── src/app.js ────────────────────────────────────────────────────────
// app.js — the shell: hash routing, one data layer, and the screen table of §11.2.
//
// Everything here is wiring. The decisions live in states.js (what an envelope means), views.js
// (what a screen shows) and unavailable.js (what cannot be shown); app.js only decides which one
// runs and puts the result on the page.
//
// `createDashboard` is deliberately DOM-free: it takes an api and returns `load(screenId, params)`,
// so a test can drive every screen against the stub transport without a browser. `boot()` is the
// only function that touches a document.










/**
 * The screens. Five are in the navigation; the event detail, the catalogue of gaps and the state
 * gallery are reached by a link or an address. What used to be separate screens for unsanctioned
 * use, data classes and degraded collection are now a switch on Usage and on Devices.
 */
const SCREENS = Object.freeze([
  Object.freeze({ id: 'posture', label: 'Overview', question: null, kind: 'posture' }),
  Object.freeze({ id: 'tools', label: 'Tools', question: 1, kind: 'answer', questionId: 'q1_tools_ranked' }),
  Object.freeze({ id: 'teams', label: 'Teams', question: 3, kind: 'answer', questionId: 'q3_team_growth' }),
  Object.freeze({ id: 'person', label: 'Users', question: 6, kind: 'input', questionId: 'q6_subject_series' }),
  Object.freeze({ id: 'devices', label: 'Devices', question: 7, kind: 'answer', questionId: 'q7_devices' }),
  Object.freeze({ id: 'audit', label: 'Audit', question: 10, kind: 'answer', questionId: 'q10_audit_trail' }),
  Object.freeze({ id: 'event', label: 'Event detail', question: 9, kind: 'input', questionId: 'q9_event_detail' }),
  Object.freeze({ id: 'unavailable', label: 'What we cannot show', question: null, kind: 'catalogue' }),
  Object.freeze({ id: 'gallery', label: 'State gallery', question: null, kind: 'gallery' }),
]);

/** What the Usage screen can show: each is its own question, switched in place. */
const USAGE_MODES = Object.freeze({
  tools: Object.freeze({ label: 'Tools', questionId: 'q1_tools_ranked', view: toolsView }),
  classes: Object.freeze({ label: 'Data classes', questionId: 'q4_class_mix', view: classesView }),
  unsanctioned: Object.freeze({ label: 'Unsanctioned', questionId: 'q2_unsanctioned_users', view: unsanctionedView }),
});

function usageMode(filters) {
  return USAGE_MODES[filters?.view] ? filters.view : 'tools';
}

/** Addresses of screens that were merged into another, so an old link still lands somewhere true. */
const SCREEN_ALIASES = Object.freeze({
  unsanctioned: Object.freeze({ id: 'tools', filters: Object.freeze({ view: 'unsanctioned' }) }),
  classes: Object.freeze({ id: 'tools', filters: Object.freeze({ view: 'classes' }) }),
  degraded: Object.freeze({ id: 'devices', filters: Object.freeze({ status: 'attention' }) }),
});

function resolveScreen(id, filters = {}) {
  const alias = SCREEN_ALIASES[id];
  return alias ? { id: alias.id, filters: { ...filters, ...alias.filters } } : { id, filters };
}

const SCREEN_IDS = Object.freeze(SCREENS.map((s) => s.id));

/** Turn any thrown error into a refusal view state, so no screen can crash into a blank page. */
function refusalFrom(error, { title = 'Read refused' } = {}) {
  return refusalView({
    resultState: error?.resultState ?? 'unsupported_query_shape',
    error: error?.envelope?.error ?? { code: error?.reason ?? 'client_error', message: String(error?.message ?? error) },
    banners: [],
    data: [],
  }, { title });
}

/**
 * Build the dashboard's behaviour over one api.
 *
 * @param {object} input
 * @param {ReturnType<typeof createQueryApi>} input.api
 * @param {Date} [input.now]
 */
function createDashboard({ api, now = () => new Date(), exploreHref = 'explore.html' }) {
  /** The last coverage and freshness blocks seen are kept, for a screen that reads nothing itself. */
  const observed = { coverage: null, freshness: null, watermarks: new Map() };

  function remember(state) {
    if (state.coverage) observed.coverage = state.coverage;
    if (state.freshness) {
      observed.freshness = state.freshness;
      const key = `${state.freshness.aggregate ?? 'unknown'}`;
      observed.watermarks.set(key, state.freshness);
    }
  }

  function shell() {
    return { coverage: observed.coverage, freshness: observed.freshness };
  }

  async function ask(questionId, ctx) {
    const question = QUESTIONS[questionId];
    const body = question.request(ctx);
    const envelope = await api.run(body);
    const state = readState(envelope);
    remember(state);
    return state;
  }

  /**
   * Load one screen. Returns `{view, shell}`; never throws for an API-level problem, because a
   * refusal is a state to render rather than a crash.
   */
  async function load(screenId, given = {}) {
    const resolved = resolveScreen(screenId, given.filters ?? {});
    const params = { ...given, filters: resolved.filters };
    const screen = SCREENS.find((s) => s.id === resolved.id) ?? SCREENS[0];
    const ctx = context({ preset: params.preset ?? 'd7', filters: params.filters ?? {}, now: now() });
    try {
      switch (screen.kind) {
        case 'posture': {
          const devices = await ask('q7_devices', context({ preset: ctx.preset, limit: 500, filters: params.filters ?? {}, now: now() }));
          // The summary reads three more questions. One that fails leaves its panel empty rather
          // than taking the page down.
          const part = async (questionId) => {
            try {
              return await ask(questionId, ctx);
            } catch {
              return null;
            }
          };
          const tools = await part('q1_tools_ranked');
          const classes = await part('q4_class_mix');
          const findings = await part('q5_findings');
          return { view: postureView({ devices, tools, classes, findings }), shell: shell() };
        }
        case 'answer': {
          if (screen.questionId === 'q6_subject_series' || screen.questionId === 'q9_event_detail') {
            return { view: needsInputView({ id: screen.id, title: screen.label, question: null, hint: 'This screen needs an identifier from another screen.' }), shell: shell() };
          }
          if (screen.id === 'tools') {
            const mode = USAGE_MODES[usageMode(params.filters)];
            return { view: mode.view(await ask(mode.questionId, ctx)), shell: shell() };
          }
          const state = await ask(screen.questionId, ctx);
          return { view: viewFor(screen.id, state, params), shell: shell() };
        }
        case 'input': {
          if (screen.id === 'person') {
            const subject = params.filters?.subject;
            if (!subject) return { view: needsInputView({ id: 'person', title: 'Users', question: null, hint: null, search: Object.freeze({ value: '' }) }), shell: shell() };
            const state = await ask('q6_subject_series', context({ preset: ctx.preset, filters: { subject }, now: now() }));
            return { view: personView(state, { subject }), shell: shell() };
          }
          const submissionId = params.filters?.submission_id;
          if (!submissionId) return { view: needsInputView({ id: 'event', title: 'Event detail', question: null, hint: 'Reached from a row that names a submission.' }), shell: shell() };
          const state = await ask('q9_event_detail', context({ filters: { submission_id: submissionId, received_at_hint: params.filters?.received_at_hint }, now: now() }));
          return { view: eventView(state), shell: shell() };
        }
        case 'catalogue':
          return { view: unavailableView(), shell: shell() };
        case 'gallery':
        default:
          return { view: null, shell: shell(), gallery: true };
      }
    } catch (error) {
      return { view: refusalFrom(error, { title: screen.label }), shell: shell() };
    }
  }

  function viewFor(screenId, state, params) {
    switch (screenId) {
      case 'teams': return teamsView(state);
      case 'devices': return devicesView(state, { filters: params.filters ?? {}, now: now(), exploreHref });
      case 'audit': return state.resultState === 'audit_chain_broken' ? refusalView(state, { title: 'Audit' }) : auditView(state);
      default: return refusalView(state, { title: screenId });
    }
  }

  return Object.freeze({ load, observed, screenIds: SCREEN_IDS });
}

/** Parse `#screen?preset=d30&subject=u_1` into a screen id and params. */
function parseHash(hash) {
  const raw = String(hash ?? '').replace(/^#/, '');
  const [path, queryString] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const id = parts[0] || 'posture';
  const filters = {};
  const params = new URLSearchParams(queryString ?? '');
  for (const [key, value] of params.entries()) filters[key] = value;
  return { id, scenario: id === 'gallery' ? parts[1] : undefined, preset: filters.preset, filters };
}

/** The navigation of shell.js, with each screen's question number for its tooltip. */
const NAV_ITEMS = shellNavItems({ questionOf: (id) => SCREENS.find((s) => s.id === id)?.question ?? null });

/** Screens whose question takes a time window, and the windows offered. */
const WINDOWED_KINDS = Object.freeze(['answer', 'input']);
const UNWINDOWED_SCREENS = Object.freeze(['devices', 'event']);
const PRESET_LABELS = Object.freeze({ h24: '24h', d7: '7d', d30: '30d', d90: '90d' });

/** The window switcher for a screen: each preset is a link that keeps the other parameters. */
function presetsFor(screen, preset, filters) {
  if (!WINDOWED_KINDS.includes(screen.kind) || UNWINDOWED_SCREENS.includes(screen.id)) return null;
  const current = PRESET_LABELS[preset] ? preset : 'd7';
  const items = Object.entries(PRESET_LABELS).map(([id, label]) => {
    const params = new URLSearchParams({ ...filters, preset: id });
    return { id, label, href: `#${screen.id}?${params.toString()}` };
  });
  return { current, items };
}

/** The switch a screen carries beside its window: what Usage shows. */
function switchFor(screen, preset, filters) {
  const link = (extra) => {
    const query = new URLSearchParams({ ...(PRESET_LABELS[preset] ? { preset } : {}), ...extra }).toString();
    return `#${screen.id}${query ? `?${query}` : ''}`;
  };
  if (screen.id === 'tools') {
    return {
      label: 'Show',
      current: usageMode(filters),
      items: Object.entries(USAGE_MODES).map(([id, mode]) => ({ id, label: mode.label, href: link(id === 'tools' ? {} : { view: id }) })),
    };
  }
  return null;
}

/**
 * Boot the dashboard into a document. The only function in this package that touches the DOM.
 *
 * @param {object} input
 * @param {Document} input.document
 * @param {string} [input.scenario] one of SCENARIO_NAMES; ignored when `api` is supplied
 * @param {object} [input.api]      a real api, e.g. over httpTransport
 */
async function boot({ document, scenario = 'realistic', api } = {}) {
  const root = document.getElementById('app');
  const nav = document.getElementById('nav');
  // `?transport=live` reads the real query API through the endpoint on the page's own origin,
  // exactly as the Explore page does. Without it the page runs on canned envelopes and says so.
  const live = !api && new URLSearchParams(document.location.search ?? '').get('transport') === 'live';
  // One dashboard for the whole session, so the last coverage read carries across navigation.
  const stubs = api || live ? null : scenarioTransport(scenario);
  const active = api ?? createQueryApi({ transport: live ? httpTransport() : stubs });
  const query = live ? '?transport=live' : '';
  const dashboard = createDashboard({ api: active, exploreHref: `explore.html${query}` });
  // The Explore page is a sibling page, not a screen: it is linked from the top of the navigation
  // and carries the same data source.
  const navItems = NAV_ITEMS.map((item) => (item.id === 'explore' ? { ...item, href: `explore.html${query}` } : item));
  const collapsed = readCollapsed(document);

  let paintedNav = null;
  let paintedScreen = null;

  async function render() {
    const { id: routeId, scenario: routeScenario, preset, filters: routeFilters } = parseHash(document.location.hash);
    const { id, filters } = resolveScreen(routeId, routeFilters);
    if (routeScenario && stubs && typeof stubs.setScenario === 'function') stubs.setScenario(routeScenario);
    const screen = SCREENS.find((s) => s.id === id) ?? SCREENS[0];
    // The navigation is repainted only when it changes, so its groups do not re-open on every click.
    const navHtml = renderNav(navItems, screen.id, { collapsed: [...collapsed] });
    if (navHtml !== paintedNav) {
      paintedNav = navHtml;
      nav.innerHTML = navHtml;
    }
    // A change within a screen (a filter, a window, a search) updates it in place: no entrance
    // is replayed, and the search box keeps the focus it had.
    const sameScreen = screen.id === paintedScreen;
    // Moving to another screen swaps the content with a short fade; only the first load arrives in full.
    root.classList?.toggle('switched', !sameScreen && paintedScreen !== null);
    paintedScreen = screen.id;
    root.classList?.toggle('same-screen', sameScreen);
    const typing = sameScreen && document.activeElement?.name === 'subject';
    const { view, shell, gallery } = await dashboard.load(screen.id, { preset, filters });
    if (gallery) {
      root.innerHTML = renderGallery(SCENARIO_NAMES.map((name) => ({ id: name, label: SCENARIOS[name].label })), stubs ? stubs.scenario() : 'live')
        + `<p class="gallery-hint">Scenario in force: <strong>${stubs ? stubs.label() : 'live API'}</strong>. Pick another, then visit any screen.</p>`;
      return;
    }
    const { preset: _preset, ...others } = filters;
    root.innerHTML = renderScreen(view, { ...shell, eyebrow: groupOf(screen.id), switch: switchFor(screen, preset, others), presets: presetsFor(screen, preset, others) });
    if (typing) root.querySelector?.('input[name="subject"]')?.focus();
  }

  wireShell({ document, live, collapsed });

  // The handler returns the render promise. A browser ignores a listener's return value, so this
  // costs nothing there; it means a test can await a navigation and read the finished page rather
  // than racing it.
  // A browser fires hashchange on the window, not the document.
  (document.defaultView ?? document).addEventListener('hashchange', render);
  // The person screen's one input: put the reference in the address, which is what renders it.
  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (form?.dataset?.screen !== 'person') return;
    event.preventDefault();
    const subject = form.elements.subject.value.trim();
    document.location.hash = subject ? `#person?subject=${encodeURIComponent(subject)}` : '#person';
  });
  await render();

  return { render, dashboard };
}

// ─── epilogue ─────────────────────────────────────────────────────────────────
let __booted = false;
function __boot() {
  if (__booted) return;
  __booted = true;
  boot({ document, scenario: 'realistic' });
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', __boot);
  else __boot();
}

export { boot, createDashboard, parseHash, SCREENS, SCREEN_IDS, readState, measureOf, isSuppressed, sumMeasure, renderScreen, renderValue, createQueryApi, createStubTransport, scenarioTransport, SCENARIO_NAMES, QUESTIONS, buildDocument, buildTemplate, GAPS };
</script>
