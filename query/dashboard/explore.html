}

/**
 * The request for one page of a dataset. `window` is passed in already resolved, and the caller
 * reuses the same one for every later page: a cursor is bound to the query it was issued for, so
 * a window recomputed from the clock on page two would be a different query.
 *
 * @param {object} input
 * @param {ExploreDataset} input.dataset
 * @param {Record<string,string>} input.filters
 * @param {{from:string,to:string}|null} input.window
 * @param {string|null} [input.cursor]
 * @param {number} [input.limit]
 */
function buildExploreRequest({ dataset, filters, window, cursor = null, limit = 50 }) {
  return QUESTIONS[dataset.questionId].request(context({
    ...(window ? { window } : {}),
    limit,
    cursor,
    filters,
  }));
}

/** The single-record read behind an event or finding row. */
function buildExploreRecordRequest({ submissionId, receivedAtHint }) {
  return QUESTIONS.q9_event_detail.request(context({
    filters: { submission_id: submissionId, received_at_hint: receivedAtHint },
  }));
}

/** `#events?window=d7&tool=claude_web&open=<key>`: the whole page state, so a search can be linked. */
function encodeExploreHash({ dataset, windowPreset, filters, open }) {
  const params = new URLSearchParams();
  if (windowPreset && windowPreset !== dataset.defaultWindow) params.set('window', windowPreset);
  for (const field of dataset.fields) {
    const value = filters[field.name];
    if (typeof value === 'string' && value !== '') params.set(field.name, value);
  }
  if (open) params.set('open', open);
  const query = params.toString();
  return `#${dataset.id}${query ? `?${query}` : ''}`;
}

/**
 * Read a hash back. A parameter the dataset does not know is a problem, exactly as it would be in
 * the query bar: a link that carried a filter this page dropped would show a broader result than
 * the one that was shared.
 */
function decodeExploreHash(hash) {
  const raw = String(hash ?? '').replace(/^#/, '');
  const [path, queryString] = raw.split('?');
  const dataset = exploreDataset(path);
  const params = new URLSearchParams(queryString ?? '');
  const filters = {};
  const problems = [];
  if (path && !EXPLORE_DATASETS[path]) {
    problems.push(Object.freeze({
      code: 'unknown_dataset',
      token: path,
      message: `"${path}" is not something this page can search.`,
      fix: `Showing ${dataset.label} instead. It can search: ${EXPLORE_DATASET_IDS.map((id) => EXPLORE_DATASETS[id].label).join(', ')}.`,
    }));
  }
  for (const [name, value] of params.entries()) {
    if (RESERVED_KEYS.includes(name)) continue;
    const problem = checkExploreFilter(dataset, name, value);
    if (problem) problems.push(problem);
    else filters[name] = value;
  }
  return Object.freeze({
    dataset,
    windowPreset: exploreWindowPreset(dataset, params.get('window')),
    filters: Object.freeze(filters),
    problems: Object.freeze(problems),
    open: params.get('open') || null,
  });
}

// ── retrieved content ────────────────────────────────────────────────────────────────────────
//
// What a device captures for one request is more than what a person typed. A client wraps the
// typed text in context of its own (Claude Code prepends <system-reminder> blocks to the user
// message), resends the whole conversation on every turn, and makes requests no person wrote at
// all (telemetry batches). Retrieved content is shown both ways: what was typed, and everything
// that was captured. The split is made here, for display only; nothing about the capture changes.

const EXPLORE_INJECTED_BLOCK = /<system-reminder>[\s\S]*?<\/system-reminder>/g;

/** What a capture is, in the words the detail panel uses when there is nothing typed to show. */
const EXPLORE_CAPTURE_KINDS = Object.freeze({
  prompt: 'a prompt',
  internal: 'client telemetry, with nothing a person typed',
  other: 'a request with no user message',
});

function exploreStripInjected(text) {
  return String(text ?? '').replace(EXPLORE_INJECTED_BLOCK, '').trim();
}

/** A message's text: a string, or the text blocks of a block list. Tool results are not typed text. */
function exploreMessageText(content) {
  if (typeof content === 'string') return content;
  if (!Array.isArray(content)) return '';
  return content
    .filter((block) => block && block.type === 'text' && typeof block.text === 'string' && block.text.trim() !== '')
    .map((block) => block.text)
    .join('\n');
}

/**
 * Split retrieved content into what the person typed and what kind of capture it is.
 *
 * The content is either the prompt text the device extracted, or the request body as observed
 * when it could not extract one. In a body, the latest user message that carries text is this
 * turn's input: earlier ones are the conversation being resent.
 *
 * @param {string} content
 * @returns {{typed: string, kind: 'prompt'|'internal'|'other'}}
 */
function exploreUserInput(content) {
  const trimmed = String(content ?? '').trim();
  let body = null;
  if (trimmed.startsWith('{')) {
    try {
      body = JSON.parse(trimmed);
    } catch {
      body = null;
    }
  }
  if (!body || typeof body !== 'object') return Object.freeze({ typed: exploreStripInjected(trimmed), kind: 'prompt' });
  const messages = Array.isArray(body.messages) ? body.messages : [];
  for (let i = messages.length - 1; i >= 0; i -= 1) {
    if (messages[i]?.role !== 'user') continue;
    const typed = exploreStripInjected(exploreMessageText(messages[i].content));
    if (typed !== '') return Object.freeze({ typed, kind: 'prompt' });
  }
  return Object.freeze({ typed: '', kind: Array.isArray(body.events) ? 'internal' : 'other' });
}

/** Every filter field a dataset declares must be a parameter its template admits. */
function exploreFieldsOutsideTemplate(dataset) {
  const admitted = TEMPLATES[dataset.questionId]?.params ?? [];
  return dataset.fields.map((f) => f.name).filter((name) => !admitted.includes(name));
}

// ─── src/explore-stub.js ───────────────────────────────────────────────
// explore-stub.js — a sample-data transport for the Explore page.
//
// The stub in fixtures.js answers every request for a question with the same three rows, which is
// right for a state gallery and useless for a search: a filter that changes nothing cannot be seen
// to work. This transport holds a few hundred generated rows and answers the four list templates
// and the record template the way the API would: it applies the window and every filter, pages
// with a cursor that is bound to the query it was issued for, and ends an iteration only with
// `next_cursor: null`.
//
// Everything it returns is invented, and the page labels it as sample data. It is seeded from a
// constant, so the same request at the same `now` gives the same rows and a test can assert them.
//
// It speaks only the envelope: nothing here is a query, and nothing reaches a network.



const SAMPLE_EVENT_COUNT = 137;
const SAMPLE_SPAN_MS = 30 * 86_400_000;
const SAMPLE_CURSOR_TTL_MS = 15 * 60_000;

/** What the sample-state control can force, so every state of the page can be looked at. */
const EXPLORE_SCENARIOS = Object.freeze({
  realistic: 'Realistic mix',
  empty: 'Nothing found',
  too_broad: 'Refused: too broad',
  busy: 'Busy (429)',
  audit_unavailable: 'Audit unavailable',
  cursor_expired: 'Cursor expires on page two',
  destroyed: 'Record destroyed',
});

const EXPLORE_SCENARIO_NAMES = Object.freeze(Object.keys(EXPLORE_SCENARIOS));

const SAMPLE_TOOLS = Object.freeze([
  'chatgpt_web', 'chatgpt_web', 'chatgpt_web', 'claude_web', 'claude_web', 'copilot_chat', 'copilot_chat',
  'gemini_web', 'perplexity_web', 'cursor_ide', 'shadow_llm_gateway',
]);
const SAMPLE_DEPARTMENTS = Object.freeze(['Engineering', 'Finance', 'Legal', 'Customer Success', 'Sales', 'People']);
const SAMPLE_CLASSES = Object.freeze(['customer_pii', 'source_code', 'credential', 'payment_card', 'legal_commercial', 'government_id', 'health']);
const SAMPLE_RULES = Object.freeze({
  payment_card: Object.freeze({ rule: 'PCI_PAN_PATTERN', rule_title: 'Payment card number in prompt', severity: 'critical' }),
  credential: Object.freeze({ rule: 'SECRET_API_KEY', rule_title: 'API key or access token', severity: 'critical' }),
  government_id: Object.freeze({ rule: 'GOV_ID_NUMBER', rule_title: 'Government identifier', severity: 'high' }),
  customer_pii: Object.freeze({ rule: 'PII_CUSTOMER_RECORD', rule_title: 'Customer personal data', severity: 'high' }),
  source_code: Object.freeze({ rule: 'SRC_INTERNAL_REPO', rule_title: 'Proprietary source code', severity: 'high' }),
  health: Object.freeze({ rule: 'PHI_CLINICAL_TERM', rule_title: 'Health information', severity: 'high' }),
  legal_commercial: Object.freeze({ rule: 'LEGAL_CONTRACT_TERMS', rule_title: 'Contract or commercial terms', severity: 'medium' }),
});
const SAMPLE_ANALYSTS = Object.freeze(['r.okafor@customer.example', 'm.lindqvist@customer.example', 'd.haddad@customer.example']);

/** mulberry32: small, seedable, and good enough to spread sample rows. */
function sampleRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function sampleHex(value, width) {
  return (value >>> 0).toString(16).padStart(width, '0').slice(-width);
}

/** A canonical version-4-shaped uuid from two small integers. */
function sampleUuid(space, index) {
  const a = Math.imul(index + 1, 2654435761) >>> 0;
  const b = Math.imul(index + 7, 40503) >>> 0;
  return `${sampleHex(a, 8)}-${sampleHex(space, 4)}-4${sampleHex(b, 3)}-9${sampleHex(a >>> 12, 3)}-${sampleHex(b, 4)}${sampleHex(a ^ b, 8)}`;
}

function sampleIso(ms) {
  return new Date(ms).toISOString().replace(/\.\d{3}Z$/, 'Z');
}

/**
 * Build the sample corpus, anchored at `now` so the window presets always have something in them.
 *
 * @param {Date} now
 */
function buildExploreSample(now) {
  const rand = sampleRng(0x5ac0ffee);
  const pick = (list) => list[Math.floor(rand() * list.length)];
  const end = now.getTime() - 4 * 60_000;

  const people = Array.from({ length: 23 }, (_, i) => Object.freeze({
    subject: `u_${sampleHex(Math.imul(i + 3, 48271), 4)}`,
    department: SAMPLE_DEPARTMENTS[i % SAMPLE_DEPARTMENTS.length],
    device: sampleUuid(0xd0, i % 14),
  }));

  const events = [];
  let cursorMs = end;
  for (let i = 0; i < SAMPLE_EVENT_COUNT; i += 1) {
    cursorMs -= Math.floor(rand() * 2 * (SAMPLE_SPAN_MS / SAMPLE_EVENT_COUNT)) + 1000;
    const person = pick(people);
    const tool = pick(SAMPLE_TOOLS);
    const roll = rand();
    const mode = roll < 0.15 ? 'm0' : roll < 0.55 ? 'm1' : roll < 0.85 ? 'm2' : 'm3';
    const detectionOnly = mode === 'm0';
    const classified = !detectionOnly && rand() < 0.55;
    const labels = detectionOnly ? null : classified
      ? [{ class: pick(SAMPLE_CLASSES), score: Math.round((0.55 + rand() * 0.44) * 100) / 100 }]
      : [];
    if (labels && labels.length === 1 && rand() < 0.2) {
      const second = pick(SAMPLE_CLASSES);
      if (second !== labels[0].class) labels.push({ class: second, score: Math.round((0.5 + rand() * 0.4) * 100) / 100 });
    }
    const strong = labels && labels.some((l) => l.score >= 0.8);
    const actionRoll = rand();
    const action = detectionOnly ? null : strong ? (actionRoll < 0.3 ? 'blocked' : actionRoll < 0.7 ? 'warned' : 'logged') : 'logged';
    const contentState = mode === 'm2' ? 'local_only' : mode === 'm3' ? (rand() < 0.15 ? 'shredded' : 'uploaded') : 'not_captured';
    const lateFlush = rand() < 0.06;
    const occurred = lateFlush ? cursorMs - Math.floor((1 + rand() * 8) * 86_400_000) : cursorMs - Math.floor(2000 + rand() * 240_000);
    const routes = detectionOnly ? ['proc.detect'] : rand() < 0.35 ? ['ext.page_context', 'proxy.tls'] : [rand() < 0.7 ? 'ext.page_context' : 'proxy.tls'];
    events.push(Object.freeze({
      submission_id: sampleUuid(0xe0, i),
      received_at: sampleIso(cursorMs),
      first_occurred_at: sampleIso(occurred),
      last_occurred_at: sampleIso(occurred + Math.floor(rand() * 180_000)),
      subject: person.subject,
      tool,
      device: person.device,
      department: person.department,
      mode,
      action,
      content_state: contentState,
      route: routes[0],
      detection_basis: detectionOnly ? 'model_detection' : rand() < 0.08 ? 'usage_rollup' : 'prompt',
      merge_confidence: rand() < 0.08 ? 'low' : 'high',
      confidence: detectionOnly ? null : rand() < 0.07 ? 'degraded' : strong ? 'high' : 'medium',
      observation_count: routes.length,
      size_bytes: detectionOnly ? null : Math.floor(180 + rand() * 9200),
      labels: labels ? Object.freeze(labels.map((l) => Object.freeze(l))) : null,
      observed_routes: Object.freeze(routes),
    }));
  }

  const findings = [];
  for (const event of events) {
    if (!event.labels || event.action === null) continue;
    for (const label of event.labels) {
      if (label.score < 0.7) continue;
      const rule = SAMPLE_RULES[label.class];
      const reviewRoll = rand();
      findings.push(Object.freeze({
        submission_id: event.submission_id,
        detected_at: sampleIso(Date.parse(event.received_at) + 1000),
        rule: rule.rule,
        rule_title: rule.rule_title,
        class: label.class,
        severity: rule.severity,
        subject: event.subject,
        tool: event.tool,
        mode: event.mode,
        review_state: reviewRoll < 0.6 ? 'open' : reviewRoll < 0.8 ? 'disputed' : 'confirmed',
        decided_locally: event.mode !== 'm3',
      }));
    }
  }

  const devices = [];
  for (let i = 0; i < 14; i += 1) {
    const device = sampleUuid(0xd0, i);
    const os = i % 3 === 0 ? 'macos' : 'windows';
    const region = i % 4 === 0 ? 'us' : 'eu';
    if (i === 11) {
      devices.push(Object.freeze({ device, device_os: os, managed_state: 'unmanaged', region, liveness: 'never_reported', collector: null, collector_state: null, spool_depth: null, spool_dropped_total: null, last_seen_at: null }));
      continue;
    }
    const liveness = i === 5 ? 'stale' : i === 9 ? 'revoked' : 'reporting';
    const seen = liveness === 'reporting' ? end - Math.floor(rand() * 600_000) : end - Math.floor((2 + rand() * 16) * 86_400_000);
    for (const collector of ['capture_core', 'capture_extension']) {
      const state = liveness === 'revoked' ? 'absent' : liveness === 'stale' ? 'degraded' : i === 2 && collector === 'capture_extension' ? 'tampered' : 'healthy';
      devices.push(Object.freeze({
        device,
        device_os: os,
        managed_state: i === 7 ? 'unknown' : 'managed',
        region,
        liveness,
        collector,
        collector_state: state,
        spool_depth: state === 'degraded' ? Math.floor(200 + rand() * 900) : 0,
        spool_dropped_total: liveness === 'revoked' ? 4412 : 0,
        last_seen_at: sampleIso(seen),
      }));
    }
  }
  devices.sort((a, b) => (a.device === b.device ? String(a.collector).localeCompare(String(b.collector)) : a.device.localeCompare(b.device)));

  const audit = [];
  let auditMs = end;
  for (let i = 0; i < 44; i += 1) {
    auditMs -= Math.floor(rand() * 2 * (SAMPLE_SPAN_MS / 44)) + 1000;
    const kind = rand();
    const event = pick(events);
    const record = kind < 0.3;
    const action = record ? 'query.record' : kind < 0.65 ? 'query.events' : kind < 0.85 ? 'query.findings' : 'audit.read';
    audit.push(Object.freeze({
      audit_seq: 8200 - i,
      occurred_at: sampleIso(auditMs),
      actor_type: 'user',
      actor: pick(SAMPLE_ANALYSTS),
      action,
      object_type: action === 'audit.read' ? 'ops.audit' : action === 'query.findings' ? 'mart.v_finding' : 'ingest.submission',
      object_id: record ? event.submission_id : null,
      subject: action === 'audit.read' ? null : event.subject,
      case: record && rand() < 0.6 ? `CASE-2026-${100 + Math.floor(rand() * 60)}` : null,
      detail: Object.freeze(record ? {} : { filters: action === 'audit.read' ? [] : ['subject'] }),
      prev_hash: sampleHex(Math.imul(8199 - i, 2246822519), 8),
      row_hash: sampleHex(Math.imul(8200 - i, 2246822519), 8),
    }));
  }

  return Object.freeze({
    events: Object.freeze(events),
    findings: Object.freeze(findings),
    devices: Object.freeze(devices),
    audit: Object.freeze(audit),
  });
}

/** Template name to the rows it reads, the clock its window bounds, and whether the read is audited. */
const SAMPLE_LISTS = Object.freeze({
  q8_activity: Object.freeze({ rows: 'events', clock: 'received_at', source: 'ingest.submission', audited: true }),
  q5_findings: Object.freeze({ rows: 'findings', clock: 'detected_at', source: 'mart.v_finding', audited: true }),
  q7_devices: Object.freeze({ rows: 'devices', clock: null, source: 'mart.v_device_liveness', audited: false }),
  q10_audit_trail: Object.freeze({ rows: 'audit', clock: 'occurred_at', source: 'ops.audit', audited: true }),
});

const SAMPLE_NON_FILTERS = Object.freeze(['window', 'limit', 'cursor']);

function sampleMatches(row, name, value) {
  // On an event, `class` is a predicate over the labels; on a finding it is a column.
  if (name === 'class' && 'labels' in row) return Array.isArray(row.labels) && row.labels.some((l) => l.class === value);
  return row[name] === value;
}

function sampleEnvelope(resultState, body) {
  return Object.freeze({ api_version: '1', query_version: '1', result_state: resultState, ...body });
}

function sampleObservations(event) {
  return event.observed_routes.map((route, i) => Object.freeze({
    observation_event_id: `obs_${event.submission_id.slice(0, 8)}_${i + 1}`,
    observation_source: route,
    observation_kind: event.detection_basis,
    direction: event.detection_basis === 'model_detection' ? 'none' : 'egress',
    observation_occurred_at: i === 0 ? event.first_occurred_at : event.last_occurred_at,
    observation_size_bytes: event.size_bytes,
  }));
}

const SAMPLE_PROMPTS = Object.freeze([
  'Summarise the Q4 revenue deck for the board in five bullet points.',
  'Rewrite this customer complaint reply so it sounds less defensive.',
  'Why does this function return undefined when the list is empty?',
  'Draft an email to the supplier about the late delivery of the March order.',
  'Explain the indemnity clause in this contract in plain English.',
  'Turn these meeting notes into action items with owners and dates.',
  'What is the capital of Australia?',
  'Write a SQL query that finds customers with no orders in the last 90 days.',
]);

/** What the sample person typed for an event. Invented, and stable for a given event. */
function sampleTyped(event) {
  const n = parseInt(event.submission_id.slice(0, 8), 16);
  return SAMPLE_PROMPTS[n % SAMPLE_PROMPTS.length];
}

/** Everything the sample device captured: the typed text inside the context a client adds. */
function sampleCapture(event) {
  return `<system-reminder>\nSample client context for ${event.tool}. A real client adds its own instructions here.\n</system-reminder>\n${sampleTyped(event)}`;
}

/**
 * The sample transport.
 *
 * @param {object} [input]
 * @param {() => Date} [input.now]
 * @param {string} [input.scenario]  one of EXPLORE_SCENARIO_NAMES
 * @param {number} [input.latencyMs] a pause before each answer, so a loading state can be seen
 */
function createExploreStub({ now = () => new Date(), scenario = 'realistic', latencyMs = 0 } = {}) {
  let current = EXPLORE_SCENARIO_NAMES.includes(scenario) ? scenario : 'realistic';
  const sample = buildExploreSample(now());
  const cursors = new Map();
  let cursorSerial = 0;
  let auditSerial = 8200;

  const freshFor = (source) => freshness({ aggregate: source, last_run_at: sampleIso(now().getTime() - 180_000), last_complete_bucket: sampleIso(now().getTime() - 240_000) });
  const audited = () => {
    auditSerial += 1;
    return Object.freeze({ entry_id: String(auditSerial), written_at: sampleIso(now().getTime()) });
  };

  function listReply(body) {
    const spec = SAMPLE_LISTS[body.template];
    const params = body.params ?? {};
    if (current === 'busy') return STATE_ENVELOPES.busy;
    if (current === 'audit_unavailable' && spec.audited) return STATE_ENVELOPES.audit_unavailable;
    if (current === 'too_broad' && spec.clock) {
      return sampleEnvelope('query_too_broad', {
        error: { code: 'window_too_wide', message: 'A list read is bounded to a 31-day window.', fixable: true, detail: { max_days: 31 } },
      });
    }

    const queryKey = JSON.stringify(Object.entries(params).filter(([name]) => name !== 'cursor').sort());
    let offset = 0;
    if (typeof params.cursor === 'string') {
      const held = cursors.get(params.cursor);
      cursors.delete(params.cursor);
      if (current === 'cursor_expired' || !held || held.queryKey !== queryKey || held.expires < now().getTime()) return STATE_ENVELOPES.cursor_expired;
      offset = held.offset;
    }

    let rows = current === 'empty' ? [] : sample[spec.rows];
    if (spec.clock && params.window) {
      const from = Date.parse(params.window.from);
      const to = Date.parse(params.window.to);
      rows = rows.filter((row) => {
        const at = Date.parse(row[spec.clock]);
        return at >= from && at < to;
      });
    }
    for (const [name, value] of Object.entries(params)) {
      if (SAMPLE_NON_FILTERS.includes(name)) continue;
      rows = rows.filter((row) => sampleMatches(row, name, value));
    }

    const limit = typeof params.limit === 'number' ? params.limit : 50;
    const slice = rows.slice(offset, offset + limit);
    let nextCursor = null;
    if (offset + limit < rows.length) {
      cursorSerial += 1;
      nextCursor = `sample.${cursorSerial}.${sampleHex(Math.imul(cursorSerial, 2654435761), 8)}`;
      cursors.set(nextCursor, { offset: offset + limit, queryKey, expires: now().getTime() + SAMPLE_CURSOR_TTL_MS });
    }
    const covered = current === 'empty' ? coverage() : coverage({ state: 'partial' });
    // No rows on partial coverage is not "nothing happened": the absence is a floor too.
    const resultState = rows.length > 0 ? 'ok' : covered.state === 'partial' ? 'coverage_degraded' : 'empty';
    return sampleEnvelope(resultState, {
      data: slice,
      page: Object.freeze({
        returned: slice.length,
        next_cursor: nextCursor,
        snapshot_upper_bound: sampleIso(now().getTime()),
        newer_events_exist: false,
      }),
      freshness: freshFor(spec.source),
      coverage: covered,
      ...(spec.audited ? { audit: audited() } : {}),
      meta: { source: spec.source, kind: 'list' },
    });
  }

  function recordReply(body) {
    if (current === 'busy') return STATE_ENVELOPES.busy;
    if (current === 'audit_unavailable') return STATE_ENVELOPES.audit_unavailable;
    if (current === 'destroyed') return STATE_ENVELOPES.no_longer_available;
    const event = sample.events.find((row) => row.submission_id === body.params?.submission_id);
    if (!event) return STATE_ENVELOPES.not_found;
    return sampleEnvelope('ok', {
      data: [event, ...sampleObservations(event)],
      freshness: freshFor('ingest.submission'),
      coverage: coverage({ state: 'partial' }),
      audit: audited(),
      meta: { source: 'ingest.submission', kind: 'record', content_state: event.content_state },
    });
  }

  const inner = stubTransport({
    routes: [
      { match: (body) => Boolean(SAMPLE_LISTS[body?.template]), reply: listReply },
      { match: (body) => body?.template === 'q9_event_detail', reply: recordReply },
    ],
    fallback: STATE_ENVELOPES.refused_shape,
  });

  // ── the content reads: prompt-text search and approved retrieval, over the same sample ──────
  //
  // Only an event whose content was uploaded has anything to find or retrieve, exactly as in the
  // product. The refusals are the vault's own reasons, so the page's handling of them can be seen.

  const pause = async () => {
    if (latencyMs > 0) await new Promise((resolve) => { setTimeout(resolve, latencyMs); });
  };
  const contentRefusal = (code, message) => Object.freeze({ state: 'refused', error: Object.freeze({ code, message }) });
  const uploaded = () => (current === 'empty' ? [] : sample.events.filter((event) => event.content_state === 'uploaded'));

  async function searchContent(body) {
    await pause();
    if (current === 'busy') return contentRefusal('busy', 'The service is at its concurrency limit; retry shortly.');
    if (current === 'audit_unavailable') return contentRefusal('audit_unavailable', 'The search audit row could not be committed, so the search fails closed.');
    const words = String(body?.query ?? '').toLowerCase().split(/[^a-z0-9_]+/).filter(Boolean);
    if (words.length === 0) return contentRefusal('search_disabled', 'An empty search is refused rather than returning the whole index.');
    const hits = [];
    for (const event of uploaded()) {
      const typed = sampleTyped(event);
      const lower = typed.toLowerCase();
      if (!words.every((word) => lower.includes(word))) continue;
      const snippet = typed.replace(new RegExp(`\\b(${words.join('|')})\\b`, 'gi'), '<em>$1</em>');
      hits.push(Object.freeze({ submission_id: event.submission_id, snippet, rank: 1, subject: event.subject ?? null, device: event.device ?? null, tool: event.tool ?? null }));
    }
    const limit = typeof body?.limit === 'number' ? body.limit : 20;
    return Object.freeze({ state: 'available', hits: Object.freeze(hits.slice(0, limit)), truncated: hits.length > limit });
  }

  async function retrieveContent(body) {
    await pause();
    if (current === 'busy') return contentRefusal('busy', 'The service is at its concurrency limit; retry shortly.');
    if (current === 'audit_unavailable') return contentRefusal('audit_unavailable', 'The audit row could not be committed, so no content is served.');
    const ids = Array.isArray(body?.event_ids) ? body.event_ids : [];
    const event = sample.events.find((row) => sampleObservations(row).some((o) => ids.includes(o.observation_event_id)));
    if (!event || (event.content_state !== 'uploaded' && event.content_state !== 'shredded')) {
      return contentRefusal('no_content_object', 'No content object is stored for this event.');
    }
    if (event.content_state === 'shredded' || current === 'destroyed') {
      return Object.freeze({ state: 'no_longer_available', reason: 'retention_expired', receipt_ref: 'rcpt_sample_0001' });
    }
    return Object.freeze({
      state: 'available',
      event_id: ids[0],
      grant_id: sampleUuid(0x9a, sample.events.indexOf(event)),
      raw_digest: `sha256:${sampleHex(Math.imul(sample.events.indexOf(event) + 1, 2246822519), 8).repeat(8)}`,
      content: sampleCapture(event),
    });
  }

  return Object.freeze({
    content: Object.freeze({ search: searchContent, retrieve: retrieveContent }),
    async send(body) {
      if (latencyMs > 0) await new Promise((resolve) => { setTimeout(resolve, latencyMs); });
      return inner.send(body);
    },
    setScenario(name) {
      if (EXPLORE_SCENARIO_NAMES.includes(name)) current = name;
      return current;
    },
    scenario() {
      return current;
    },
    sample,
  });
}

// ─── src/explore-render.js ─────────────────────────────────────────────
// explore-render.js — the Explore page's state to HTML. Pure: no DOM access, no I/O, no state.
//
// Every string that came from the API is escaped. The honesty rules the rest of the dashboard
// keeps are kept here the same way:
//   * both clocks are shown and the device clock is marked as possibly skewed (§14 item 10);
//   * a missing value says what is missing ("none", "unknown", "not classified") and is never a
//     blank, because a blank and an unknown look identical and mean different things;
//   * rows are shown in the order the server returned them, with no client-side sort, so no list
//     here can be turned into a ranking of people (§14 item 1);
//   * a record's detail shows metadata and what its content state permits. Content appears only
//     after a retrieval the content vault approved for that record (docs/02 §11), and never from
//     a query: no query path returns content (§14.3).






/** Which values of which field get a tint. Only real warning and fault states are tinted. */
const EXPLORE_TONES = Object.freeze({
  action: Object.freeze({ blocked: 'bad', warned: 'warn' }),
  severity: Object.freeze({ critical: 'bad', high: 'warn' }),
  liveness: Object.freeze({ revoked: 'bad', never_reported: 'bad', stale: 'warn' }),
  collector_state: Object.freeze({ tampered: 'bad', absent: 'bad', degraded: 'warn' }),
  review_state: Object.freeze({ open: 'warn' }),
  merge_confidence: Object.freeze({ low: 'warn' }),
  confidence: Object.freeze({ degraded: 'warn' }),
});

/** What an absent value of a field is called. Anything not listed is "not recorded". */
const EXPLORE_ABSENT = Object.freeze({
  action: 'none',
  case: 'none',
  subject: 'none',
  object_id: 'none',
  collector: 'none',
  collector_state: 'unknown',
  last_seen_at: 'never',
  confidence: 'not classified',
});

const DEVICE_CLOCK_TITLE = 'The device clock: possibly skewed, never normalised into server time';
const LATE_FLUSH_MS = 3_600_000;

function exploreAbsent(key) {
  return `<span class="x-absent">${escapeHtml(EXPLORE_ABSENT[key] ?? 'not recorded')}</span>`;
}

function exploreChip(key, value) {
  const tone = EXPLORE_TONES[key]?.[value];
  return `<span class="x-chip${tone ? ` x-chip-${tone}` : ''}">${escapeHtml(value)}</span>`;
}

function exploreClasses(labels) {
  if (labels === null || labels === undefined) return '<span class="x-absent">not classified</span>';
  if (!Array.isArray(labels) || labels.length === 0) return '<span class="x-absent">none found</span>';
  return labels.map((l) => `<span class="x-chip">${escapeHtml(typeof l === 'string' ? l : l.class)}</span>`).join(' ');
}

/** One value, rendered by the kind its column declares. */
function renderExploreValue(row, column, { full = false } = {}) {
  const raw = row[column.key];
  if (column.kind === 'classes') return exploreClasses(raw);
  if (raw === null || raw === undefined || raw === '') return exploreAbsent(column.key);
  switch (column.kind) {
    case 'server-clock':
      return `<time class="x-time" datetime="${escapeHtml(raw)}">${escapeHtml(formatInstant(raw))}</time>`;
    case 'device-clock': {
      const lag = row.received_at ? Date.parse(row.received_at) - Date.parse(raw) : 0;
      const late = lag > LATE_FLUSH_MS
        ? ` <span class="x-lag" title="Received long after the device clock said it happened: a spool flush, not a burst of activity">${escapeHtml(formatDuration(raw, row.received_at))} before receipt</span>`
        : '';
      return `<time class="x-time x-device-clock" datetime="${escapeHtml(raw)}" title="${DEVICE_CLOCK_TITLE}">${escapeHtml(formatInstant(raw))}</time>${late}`;
    }
    case 'vocab':
      return exploreChip(column.key, String(raw));
    case 'count':
      return `<span class="x-num">${escapeHtml(formatCount(Number(raw)))}</span>`;
    case 'id':
      return full
        ? `<span class="x-mono">${escapeHtml(raw)}</span>`
        : `<span class="x-mono" title="${escapeHtml(raw)}">${escapeHtml(String(raw).slice(0, 8))}</span>`;
    case 'rule':
      return `<span class="x-rule">${escapeHtml(raw)}</span>${row.rule ? ` <span class="x-mono x-sub">${escapeHtml(row.rule)}</span>` : ''}`;
    case 'mono':
      return `<span class="x-mono">${escapeHtml(raw)}</span>`;
    default:
      return `<span>${escapeHtml(raw)}</span>`;
  }
}

function renderExploreDatasets(state) {
  return EXPLORE_DATASET_IDS.filter((id) => id !== 'audit').map((id) => {
    const on = id === state.dataset;
    return `<button type="button" class="x-seg-item" data-act="dataset" data-dataset="${id}" aria-pressed="${on}">${escapeHtml(EXPLORE_DATASETS[id].label)}</button>`;
  }).join('');
}

function renderExploreWindow(state) {
  const dataset = EXPLORE_DATASETS[state.dataset];
  const windows = exploreWindows(dataset);
  if (windows.length === 0) return '<span class="x-window-none">Current state, so no time window</span>';
  return windows.map((w) => (
    `<button type="button" class="x-seg-item" data-act="window" data-window="${w.id}" aria-pressed="${w.id === state.windowPreset}">${escapeHtml(w.label)}</button>`
  )).join('');
}

/** Completions under the query bar. Each one is a button, so it works by pointer and by keyboard. */
function renderExploreSuggestions(suggestion) {
  if (!suggestion || suggestion.items.length === 0) return '';
  const lead = suggestion.items[0].kind === 'field' ? 'Fields' : 'Values';
  return `<span class="x-suggest-lead">${lead}</span>` + suggestion.items.map((item, i) => (
    `<button type="button" class="x-suggest-item" data-act="suggest" data-index="${i}" title="${escapeHtml(item.title ?? item.label)}">${escapeHtml(item.label)}</button>`
  )).join('');
}

function renderExploreProblems(state) {
  if (state.problems.length === 0) return '';
  const items = state.problems.map((p) => (
    `<li><strong>${escapeHtml(p.message)}</strong> <span>${escapeHtml(p.fix)}</span></li>`
  )).join('');
  return `<div class="x-problems"><p class="x-problems-head">Not searched. Nothing is dropped from a query, so fix ${state.problems.length === 1 ? 'this' : 'these'} first:</p><ul>${items}</ul></div>`;
}

/** The filters, as one row: a list for a field with known values, a short text field otherwise. */
function renderExploreRail(state) {
  const dataset = EXPLORE_DATASETS[state.dataset];
  const active = dataset.fields.filter((f) => state.filters[f.name]).length;
  const fields = dataset.fields.map((field) => {
    const value = state.filters[field.name] ?? '';
    const id = `x-f-${field.name}`;
    const on = value ? ' x-filter-on' : '';
    if (field.values) {
      const values = field.values.includes(value) || !value ? field.values : [...field.values, value];
      const options = values.map((v) => (
        `<option value="${escapeHtml(v)}"${v === value ? ' selected' : ''}>${v === value ? `${escapeHtml(field.label)}: ` : ''}${escapeHtml(v)}</option>`
      )).join('');
      return `<select class="x-select x-filter${on}" id="${id}" data-field="${field.name}" aria-label="${escapeHtml(field.label)}"><option value="">${escapeHtml(field.label)}</option>${options}</select>`;
    }
    return `<input class="x-input x-filter${on}" id="${id}" type="text" data-field="${field.name}" value="${escapeHtml(value)}" autocomplete="off" spellcheck="false" placeholder="${escapeHtml(field.label)}" aria-label="${escapeHtml(field.label)}" title="${escapeHtml(field.hint ?? field.label)}">`;
  }).join('');
  return fields + (active > 0 ? `<button type="button" class="x-link" data-act="clear">Clear ${active}</button>` : '');
}

function exploreNoun(dataset, count) {
  if (count === 1) return dataset.noun;
  return dataset.noun.endsWith('y') ? `${dataset.noun.slice(0, -1)}ies` : `${dataset.noun}s`;
}

/** What is on screen, how it is ordered, how far it reaches, and the audit entry that recorded it. */
function renderExploreSummary(state) {
  const dataset = EXPLORE_DATASETS[state.dataset];
  if (state.status !== 'ready' || !state.result) return '';
  const more = Boolean(state.result.page?.next_cursor);
  const parts = [
    `<strong>${escapeHtml(formatCount(state.rows.length))} ${escapeHtml(exploreNoun(dataset, state.rows.length))}</strong> loaded${more ? ', more available' : ''}`,
  ];
  if (state.result.audit?.entry_id) parts.push(`Audited read, entry ${escapeHtml(state.result.audit.entry_id)}`);
  const newer = state.result.page?.newer_events_exist
    ? '<button type="button" class="x-link" data-act="run">Newer rows have arrived. Search again</button>'
    : '';
  return `<p class="x-summary-line">${parts.map((p) => `<span>${p}</span>`).join('')}${newer}</p>`;
}

function exploreHead(dataset) {
  return `<thead><tr>${dataset.columns.map((c) => `<th scope="col">${escapeHtml(c.label)}</th>`).join('')}</tr></thead>`;
}

function exploreSkeleton(dataset) {
  const widths = [72, 64, 40, 56, 44, 60, 48, 36, 28];
  const rows = Array.from({ length: 8 }, (_, r) => (
    `<tr>${dataset.columns.map((_c, i) => `<td><span class="x-skel" style="width:${widths[(i + r) % widths.length]}%"></span></td>`).join('')}</tr>`
  )).join('');
  return `<table class="x-table" aria-hidden="true">${exploreHead(dataset)}<tbody>${rows}</tbody></table><p class="x-sr" role="status">Searching</p>`;
}

/** The message, the fix the API named, and the one action that makes sense for a refusal. */
function exploreRefusal(result, { again = 'Search again' } = {}) {
  const banner = result.banners[0] ?? { title: 'The read was refused', text: result.error?.message ?? result.resultState };
  const fix = fixSentence({ error: result.error });
  const showFix = fix && !banner.text.includes(fix);
  const label = result.resultState === 'busy' ? 'Retry' : result.resultState === 'cursor_expired' ? 'Restart from page one' : again;
  return `<div class="x-state x-state-refusal" role="alert"><h3>${escapeHtml(banner.title)}</h3>`
    + `<p>${escapeHtml(banner.text)}</p>`
    + (showFix ? `<p>${escapeHtml(fix)}</p>` : '')
    + `<p class="x-state-code">${escapeHtml(result.resultState)}${result.error?.code ? `, ${escapeHtml(result.error.code)}` : ''}. No rows were served.</p>`
    + `<button type="button" class="x-btn" data-act="run">${label}</button></div>`;
}

function exploreEmpty(state, dataset) {
  const known = emptyStateFor(state.result) ?? { title: 'No rows', text: 'The read succeeded and returned nothing.' };
  const active = dataset.fields.filter((f) => state.filters[f.name]).length;
  const widest = dataset.windows[dataset.windows.length - 1];
  const actions = [
    active > 0 ? `<button type="button" class="x-btn" data-act="clear">Clear ${active} filter${active === 1 ? '' : 's'}</button>` : '',
    widest && widest !== state.windowPreset
      ? `<button type="button" class="x-btn x-btn-quiet" data-act="window" data-window="${widest}">Widen the window</button>`
      : '',
  ].join('');
  return `<div class="x-state"><h3>${escapeHtml(known.title)}</h3><p>${escapeHtml(known.text)}</p>`
    + (actions ? `<div class="x-state-actions">${actions}</div>` : '')
    + '</div>';
}

function renderExploreResults(state) {
  const dataset = EXPLORE_DATASETS[state.dataset];
  if (state.status === 'blocked') {
    return '<div class="x-state"><h3>Not searched</h3><p>The query has something this page cannot place. Fix it above and search again. Nothing was sent.</p></div>';
  }
  if (state.status === 'loading' || state.status === 'idle') return exploreSkeleton(dataset);
  if (state.status === 'refused') return exploreRefusal(state.result);
  if (state.rows.length === 0) return exploreEmpty(state, dataset);

  const body = state.rows.map((row) => {
    const key = dataset.rowKey(row);
    const cells = dataset.columns.map((c) => `<td>${renderExploreValue(row, c)}</td>`).join('');
    return `<tr class="x-row" tabindex="0" data-act="open" data-key="${escapeHtml(key)}" aria-selected="${key === state.detail.key}">${cells}</tr>`;
  }).join('');

  let foot;
  if (state.moreProblem) {
    foot = exploreRefusal(state.moreProblem);
  } else if (state.result.page?.next_cursor) {
    foot = `<button type="button" class="x-btn" data-act="more"${state.loadingMore ? ' disabled' : ''}>${state.loadingMore ? 'Loading' : 'Load next page'}</button>`;
  } else {
    foot = `<p class="x-end">End of results.</p>`;
  }
  return `<table class="x-table"><caption class="x-sr">${escapeHtml(dataset.label)}. ${escapeHtml(dataset.ordering)}. Press Enter on a row for its detail.</caption>`
    + `${exploreHead(dataset)}<tbody>${body}</tbody></table><div class="x-more">${foot}</div>`;
}

function exploreFacts(pairs) {
  return `<dl class="x-facts">${pairs.map(([label, html]) => `<div><dt>${escapeHtml(label)}</dt><dd>${html}</dd></div>`).join('')}</dl>`;
}

function exploreFilterButton(dataset, field, value) {
  if (!value || !dataset.fields.some((f) => f.name === field)) return '';
  return ` <button type="button" class="x-link" data-act="filter" data-field="${field}" data-value="${escapeHtml(value)}">Filter to this</button>`;
}

function exploreDetailHead(title, id) {
  return `<header class="x-detail-head"><div><h2 id="x-detail-title" tabindex="-1">${escapeHtml(title)}</h2>`
    + (id ? `<p class="x-mono x-detail-id">${escapeHtml(id)}</p>` : '')
    + '</div><button type="button" class="x-btn x-btn-quiet" data-act="close">Close</button></header>';
}

function exploreFindingFacts(row) {
  const col = (key, kind) => ({ key, kind });
  return '<section><h3>Finding</h3>' + exploreFacts([
    ['Rule', renderExploreValue(row, col('rule_title', 'rule'))],
    ['Severity at detection', renderExploreValue(row, col('severity', 'vocab'))],
    ['Class', renderExploreValue(row, col('class', 'vocab'))],
    ['Review', `${renderExploreValue(row, col('review_state', 'vocab'))}${row.review_state === 'open' ? ' <span class="x-sub">Nobody has looked yet</span>' : ''}`],
    ['Detected', renderExploreValue(row, col('detected_at', 'server-clock'))],
    ['Decided on the device', `<span>${row.decided_locally ? 'yes' : 'no'}</span>`],
  ]) + '</section>';
}

/** A vault refusal or a transport failure: its reason, in the vault's own code where it has one. */
function exploreContentProblem(problem) {
  return `<div class="x-content-problem" role="alert"><p>${escapeHtml(problem?.message || 'The request was not served.')}</p>`
    + (problem?.code ? `<p class="x-state-code">${escapeHtml(problem.code)}</p>` : '') + '</div>';
}

/** Who typed a matching prompt, on which device, into which tool. A part the answer lacks is left out. */
function exploreHitMeta(hit) {
  // Prefer the device hostname to the UUID (ADR 0021): an analyst places a machine by its name, and
  // the UUID is still the identity behind the "open the event" action.
  const device = typeof hit.hostname === 'string' && hit.hostname !== '' ? hit.hostname : hit.device;
  const parts = [hit.subject, device, hit.tool].filter((part) => typeof part === 'string' && part !== '');
  if (parts.length === 0) return `<span class="x-mono x-sub">${escapeHtml(hit.submissionId)}</span>`;
  return `<span class="x-hit-meta x-mono">${parts.map((part) => `<span>${escapeHtml(part)}</span>`).join('<span class="x-hit-sep" aria-hidden="true">|</span>')}</span>`;
}

/**
 * The prompt-text search: its hits, or why there are none. It sits apart from the list because it
 * is a different read. A hit is a fragment and a reference; opening it reads the event.
 */
function renderExploreText(state) {
  const text = state.text;
  if (text.status === 'idle') return '';
  const head = `<div class="x-text-head"><h2>Prompts containing <span class="x-mono">${escapeHtml(text.query)}</span></h2>`
    + '<button type="button" class="x-btn x-btn-quiet" data-act="text-clear">Back to the list</button></div>';
  if (text.status === 'loading') return `<div class="x-text-panel" aria-busy="true">${head}<p class="x-sub" role="status">Searching</p></div>`;
  if (text.status === 'refused') return `<div class="x-text-panel">${head}${exploreContentProblem(text.problem)}</div>`;
  if (text.hits.length === 0) {
    return `<div class="x-text-panel">${head}<p class="x-sub">No uploaded prompt contains every one of those words.</p></div>`;
  }
  const rows = text.hits.map((hit) => {
    // The fragment is escaped whole; only the search's own highlight marks are put back.
    const snippet = escapeHtml(hit.snippet).replaceAll('&lt;em&gt;', '<em>').replaceAll('&lt;/em&gt;', '</em>');
    return `<li><button type="button" class="x-hit" data-act="hit" data-submission="${escapeHtml(hit.submissionId)}" aria-pressed="${hit.submissionId === state.detail.submissionId}">`
      + `<span class="x-hit-snippet">${snippet}</span>${exploreHitMeta(hit)}</button></li>`;
  }).join('');
  return `<div class="x-text-panel">${head}<ul class="x-hits">${rows}</ul>`
    + (text.truncated ? '<p class="x-sub">More prompts match than are shown; add a word to narrow it.</p>' : '') + '</div>';
}

/**
 * What the content state permits, for the open record. Stored content is read when the record is
 * opened and shown here: what the person typed first, the whole capture behind a disclosure. It is
 * dropped when the record is closed.
 */
function exploreContent(state, contentState, note) {
  const content = state.content;
  const chip = `<p>${exploreChip('content_state', contentState)}</p>`;
  if (contentState !== 'uploaded') return `<section class="x-content"><h3>Prompt</h3>${chip}<p>${escapeHtml(note)}</p></section>`;
  if (!state.contentAvailable) {
    return `<section class="x-content"><h3>Prompt</h3>${chip}<p class="x-sub">This page has no content path behind it, so the prompt cannot be read here.</p></section>`;
  }

  if (content.status === 'ready') {
    const typed = content.typed
      ? `<pre class="x-pre x-typed">${escapeHtml(content.typed)}</pre>`
      : `<p class="x-absent">Nothing typed: this capture is ${escapeHtml({ prompt: 'a prompt', internal: 'client telemetry', other: 'a request with no user message' }[content.kind] ?? 'not a prompt')}.</p>`;
    return `<section class="x-content"><h3>Prompt</h3>${typed}`
      + `<details class="x-capture"><summary>Everything captured for this request (${escapeHtml(formatBytes(content.bytes))})</summary><pre class="x-pre">${escapeHtml(content.full)}</pre></details>`
      + '</section>';
  }
  if (content.status === 'gone') {
    return `<section class="x-content"><h3>Prompt</h3>${chip}<div class="x-content-problem"><p>The content is no longer available${content.gone?.reason ? `: ${escapeHtml(content.gone.reason)}` : ''}.</p>`
      + (content.gone?.receipt ? `<p class="x-state-code">receipt ${escapeHtml(content.gone.receipt)}</p>` : '') + '</div></section>';
  }
  if (content.status === 'refused') {
    return `<section class="x-content"><h3>Prompt</h3>${exploreContentProblem(content.problem)}`
      + '<button type="button" class="x-btn" data-act="retrieve">Try again</button></section>';
  }
  return '<section class="x-content" aria-busy="true"><h3>Prompt</h3>'
    + '<div class="x-detail-skel" aria-hidden="true"><span class="x-skel" style="width:82%"></span><span class="x-skel" style="width:58%"></span></div>'
    + '<p class="x-sr" role="status">Reading the prompt</p></section>';
}

/** One submission, read on its own (Q9): metadata, both clocks, routes, and the content answer. */
function exploreRecord(detail, dataset, state) {
  const record = detail.record;
  const first = record.data[0];
  // The API answers with one row per observation, each repeating the submission's columns under
  // the store's own names (user_ref, tool_fingerprint, collection_mode, policy_action). A list row
  // names the same things subject, tool, mode and action, and carries the device, so the head is
  // read through both spellings rather than shown as "not recorded" when only one is present.
  const head = {
    ...first,
    subject: first.subject ?? first.user_ref ?? detail.row?.subject,
    tool: first.tool ?? first.tool_fingerprint ?? detail.row?.tool,
    device: first.device ?? first.device_id ?? detail.row?.device,
    department: first.department ?? detail.row?.department,
    mode: first.mode ?? first.collection_mode,
    action: first.action ?? first.policy_action,
    detection_basis: first.detection_basis ?? first.kind ?? detail.row?.detection_basis,
  };
  const observations = record.data.filter((row, i) => (row.observation_event_id ? true : i > 0));
  const view = eventView(record);
  const contentTile = view.tiles[0];
  const col = (key, kind) => ({ key, kind });
  const labels = Array.isArray(head.labels) && head.labels.length > 0
    ? head.labels.map((l) => `<span class="x-chip">${escapeHtml(l.class)}</span>${typeof l.score === 'number' ? ` <span class="x-sub">score ${escapeHtml(formatScore(l.score))}</span>` : ''}`).join('<br>')
    : exploreClasses(head.labels);

  const routes = observations.length === 0
    ? '<p class="x-absent">This response carries no observation rows.</p>'
    : `<table class="x-table x-table-plain"><thead><tr><th scope="col">Route</th><th scope="col">Kind</th><th scope="col">Direction</th><th scope="col">Occurred (device)</th><th scope="col">Size</th></tr></thead><tbody>${observations.map((o) => (
      `<tr><td><span class="x-mono">${escapeHtml(o.observation_source ?? 'unknown')}</span></td>`
      + `<td>${escapeHtml(o.observation_kind ?? 'unknown')}</td><td>${escapeHtml(o.direction ?? 'unknown')}</td>`
      + `<td>${o.observation_occurred_at ? `<time class="x-time x-device-clock" title="${DEVICE_CLOCK_TITLE}">${escapeHtml(formatInstant(o.observation_occurred_at))}</time>` : exploreAbsent('observation_occurred_at')}</td>`
      + `<td>${typeof o.observation_size_bytes === 'number' ? escapeHtml(formatBytes(o.observation_size_bytes)) : exploreAbsent('size')}</td></tr>`
    )).join('')}</tbody></table>`;

  return (detail.row && 'rule' in detail.row ? exploreFindingFacts(detail.row) : '')
    + exploreContent(state, String(contentTile.value.text), contentTile.note)
    + '<section><h3>Who and where</h3>' + exploreFacts([
      ['Person', `${renderExploreValue(head, col('subject', 'mono'))}${exploreFilterButton(dataset, 'subject', head.subject)}`],
      ['Tool', `${renderExploreValue(head, col('tool', 'mono'))}${exploreFilterButton(dataset, 'tool', head.tool)}`],
      ['Device', `${renderExploreValue(head, col('device', 'id'), { full: true })}${exploreFilterButton(dataset, 'device', head.device)}`],
      ...(head.department ? [['Department', `<span>${escapeHtml(head.department)}</span>${exploreFilterButton(dataset, 'department', head.department)}`]] : []),
    ]) + '</section>'
    + '<section><h3>What was decided</h3>' + exploreFacts([
      ['Policy action', renderExploreValue(head, col('action', 'vocab'))],
      ['Classes', labels],
      ['Classifier confidence', renderExploreValue(head, col('confidence', 'vocab'))],
      ['Collection mode', renderExploreValue(head, col('mode', 'vocab'))],
      ['Detection basis', renderExploreValue(head, col('detection_basis', 'mono'))],
      ['Size', typeof head.size_bytes === 'number' ? `<span class="x-num">${escapeHtml(formatBytes(head.size_bytes))}</span>` : exploreAbsent('size_bytes')],
    ]) + '</section>'
    + '<section><h3>Two clocks</h3>' + exploreFacts([
      ['Received (server)', renderExploreValue(head, col('received_at', 'server-clock'))],
      ['First occurred (device)', renderExploreValue(head, col('first_occurred_at', 'device-clock'))],
      ['Last occurred (device)', head.last_occurred_at
        ? `<time class="x-time x-device-clock" title="${DEVICE_CLOCK_TITLE}">${escapeHtml(formatInstant(head.last_occurred_at))}</time>`
        : exploreAbsent('last_occurred_at')],
    ]) + '<p class="x-sub">Neither clock is converted into the other. The device clock may be skewed.</p></section>'
    + `<section><h3>Observation routes</h3>${routes}`
    + (head.merge_confidence === 'low' ? '<p class="x-sub">Merge confidence is low: a weak key joined these observations. The row is counted, not discarded.</p>' : '')
    + '</section>'
    + (record.audit?.entry_id ? `<p class="x-audit">Opening this record was an audited read: entry ${escapeHtml(record.audit.entry_id)} at ${escapeHtml(formatInstant(record.audit.written_at))}.</p>` : '');
}

/** A device or audit row: the row already held, laid out in full. No second read is made. */
function exploreRowDetail(row, dataset) {
  const facts = dataset.detailFields.map((c) => [
    c.label,
    `${renderExploreValue(row, c, { full: true })}${exploreFilterButton(dataset, c.key, typeof row[c.key] === 'string' ? row[c.key] : null)}`,
  ]);
  const extra = row.detail && typeof row.detail === 'object' && Object.keys(row.detail).length > 0
    ? `<section><h3>Recorded detail</h3><pre class="x-pre">${escapeHtml(JSON.stringify(row.detail, null, 2))}</pre></section>`
    : '';
  return `<section>${exploreFacts(facts)}</section>${extra}`;
}

function renderExploreDetail(state) {
  const detail = state.detail;
  if (detail.status === 'closed') return '';
  const dataset = EXPLORE_DATASETS[state.dataset];
  const title = dataset.noun.charAt(0).toUpperCase() + dataset.noun.slice(1);

  if (dataset.detail === 'row') {
    return exploreDetailHead(title, null) + exploreRowDetail(detail.row, dataset);
  }
  const id = detail.submissionId;
  if (detail.status === 'loading') {
    return exploreDetailHead('Event', id)
      + `<div class="x-detail-skel" aria-hidden="true">${Array.from({ length: 9 }, (_, i) => `<span class="x-skel" style="width:${[88, 62, 74, 40, 81, 56, 69, 47, 77][i]}%"></span>`).join('')}</div>`
      + '<p class="x-sr" role="status">Reading the record</p>';
  }
  if (detail.status === 'refused') {
    const record = detail.record;
    const banner = record.banners[0] ?? { title: 'The record was not served', text: record.error?.message ?? record.resultState };
    const receipt = record.error?.receipt;
    return exploreDetailHead('Event', id)
      + `<div class="x-state x-state-refusal" role="alert"><h3>${escapeHtml(banner.title)}</h3><p>${escapeHtml(banner.text)}</p>`
      + (receipt ? exploreFacts([
        ['Receipt', `<span class="x-mono">${escapeHtml(receipt.receipt_id)}</span>`],
        ['Scope', `<span>${escapeHtml(receipt.scope_kind)}</span>`],
        ['Completed', `<time class="x-time">${escapeHtml(formatInstant(receipt.completed_at))}</time>`],
        ['Mechanisms', `<span class="x-mono">${escapeHtml((receipt.mechanisms ?? []).join(', '))}</span>`],
      ]) : '')
      + `<p class="x-state-code">${escapeHtml(record.resultState)}${record.error?.code ? `, ${escapeHtml(record.error.code)}` : ''}</p></div>`
      + (detail.row && 'rule' in detail.row ? exploreFindingFacts(detail.row) : '');
  }
  return exploreDetailHead('Event', id) + exploreRecord(detail, dataset, state);
}

// ─── src/explore-app.js ────────────────────────────────────────────────
// explore-app.js — the Explore page: one search, its filters, its results, and one result's detail.
//
// Two halves, split the way app.js splits them. `createExplorer` is DOM-free: it holds the page's
// state, makes every read through the one api, and tells a listener when the state changed, so a
// test can drive a whole search without a browser. `bootExplore` is the only function here that
// touches a document.
//
// The rules the controller keeps:
//   * a query with a problem is not sent. Nothing is dropped to make it sendable (§14 item 15);
//   * the window is resolved once per search and reused for every later page, because a cursor is
//     bound to the query it was issued for;
//   * only `next_cursor: null` ends a result set. A short page does not (DSL.md §7);
//   * a refusal is a state to show, never an empty list;
//   * an answer that arrives after a newer search began is discarded.











const DETAIL_CLOSED = Object.freeze({ status: 'closed', key: null, row: null, record: null, submissionId: null });

/** The prompt-text search: nothing asked yet. */
const TEXT_IDLE = Object.freeze({ status: 'idle', query: '', hits: Object.freeze([]), truncated: false, problem: null });
/** The content of the open record: nothing retrieved. Content is never held past the record it belongs to. */
const CONTENT_IDLE = Object.freeze({
  status: 'idle', submissionId: null, problem: null, gone: null, typed: '', kind: null, full: '', bytes: 0, grantId: null,
});

/** The event ids of a record's observations: what a retrieval names. */
function exploreEventIds(record) {
  const ids = (record?.data ?? []).map((row) => row.observation_event_id).filter((id) => typeof id === 'string' && id !== '');
  return [...new Set(ids)];
}

/** Any thrown error as a refusal state: a transport failure, a local refusal, or a bad envelope. */
function exploreRefusalFrom(error) {
  const envelope = error?.envelope
    ?? (typeof error?.toEnvelope === 'function' ? error.toEnvelope() : null)
    ?? {
      api_version: '1',
      query_version: '1',
      result_state: error?.resultState ?? 'unsupported_query_shape',
      error: { code: error?.reason ?? 'client_error', message: String(error?.message ?? error) },
    };
  return readState({ api_version: '1', query_version: '1', result_state: envelope.result_state, error: envelope.error });
}

/**
 * The page's behaviour over one api.
 *
 * @param {object} input
 * @param {{run: (body: object) => Promise<object>}} input.api
 * @param {() => Date} [input.now]
 * @param {(state: object) => void} [input.onChange]
 */
function createExplorer({ api, content = null, now = () => new Date(), onChange = () => {} }) {
  const first = EXPLORE_DATASETS[EXPLORE_DEFAULT_DATASET];
  let state = Object.freeze({
    dataset: first.id,
    windowPreset: first.defaultWindow,
    filters: Object.freeze({}),
    queryText: '',
    problems: Object.freeze([]),
    status: 'idle',
    rows: Object.freeze([]),
    result: null,
    loadingMore: false,
    moreProblem: null,
    detail: DETAIL_CLOSED,
    text: TEXT_IDLE,
    content: CONTENT_IDLE,
    /** Whether this page has a content path at all. Without one the two features say so. */
    contentAvailable: Boolean(content),
    shell: Object.freeze({ coverage: null, freshness: null }),
  });
  /** The query the rows on screen belong to: what later pages must repeat exactly. */
  let ran = null;
  let searchSeq = 0;
  let detailSeq = 0;
  let textSeq = 0;
  let contentSeq = 0;

  function set(patch) {
    // Retrieved content belongs to the record it was retrieved for. Any change of the open record
    // drops it, so content cannot stay on screen beside a different event.
    if ('detail' in patch && patch.detail.submissionId !== state.content.submissionId && state.content !== CONTENT_IDLE) {
      contentSeq += 1;
      patch = { ...patch, content: CONTENT_IDLE };
    }
    state = Object.freeze({ ...state, ...patch });
    onChange(state);
  }

  async function ask(build) {
    try {
      return readState(await api.run(build()));
    } catch (error) {
      return exploreRefusalFrom(error);
    }
  }

  function shellAfter(result) {
    return Object.freeze({
      coverage: result.coverage ?? state.shell.coverage,
      freshness: result.freshness ?? state.shell.freshness,
    });
  }

  /** Run the search the state describes, from page one. */
  async function run() {
    const dataset = EXPLORE_DATASETS[state.dataset];
    const seq = ++searchSeq;
    detailSeq += 1;
    ran = null;
    if (state.problems.length > 0) {
      set({ status: 'blocked', rows: Object.freeze([]), result: null, loadingMore: false, moreProblem: null, detail: DETAIL_CLOSED });
      return state;
    }
    const query = Object.freeze({
      dataset,
      filters: state.filters,
      window: state.windowPreset ? windowFor(state.windowPreset, now()) : null,
    });
    set({ status: 'loading', rows: Object.freeze([]), result: null, loadingMore: false, moreProblem: null, detail: DETAIL_CLOSED });
    const result = await ask(() => buildExploreRequest(query));
    if (seq !== searchSeq) return state;
    if (result.isRefusal) {
      set({ status: 'refused', result, shell: shellAfter(result) });
      return state;
    }
    ran = query;
    set({ status: 'ready', rows: Object.freeze([...result.data]), result, shell: shellAfter(result) });
    return state;
  }

  /** Fetch the next page of the search on screen and append it. */
  async function loadMore() {
    const cursor = state.result?.page?.next_cursor;
    if (state.status !== 'ready' || !cursor || !ran || state.loadingMore) return state;
    const seq = searchSeq;
    set({ loadingMore: true, moreProblem: null });
    const result = await ask(() => buildExploreRequest({ ...ran, cursor }));
    if (seq !== searchSeq) return state;
    if (result.isRefusal) {
      // The rows already shown stay. The refusal says why the list stops here.
      set({ loadingMore: false, moreProblem: result });
      return state;
    }
    set({ loadingMore: false, rows: Object.freeze([...state.rows, ...result.data]), result, shell: shellAfter(result) });
    return state;
  }

  function applyFilters(dataset, filters, problems = []) {
    set({
      filters: Object.freeze({ ...filters }),
      queryText: problems.length > 0 ? state.queryText : formatExploreQuery(filters, dataset),
      problems: Object.freeze([...problems]),
    });
    return run();
  }

  /** Search with the text of the query bar. */
  function setQuery(text) {
    const dataset = EXPLORE_DATASETS[state.dataset];
    const parsed = parseExploreQuery(text, dataset);
    set({ queryText: String(text ?? '') });
    return applyFilters(dataset, parsed.filters, parsed.problems);
  }

  /** Set or clear one filter from the rail or a detail panel. An empty value clears it. */
  function setFilter(name, value) {
    const dataset = EXPLORE_DATASETS[state.dataset];
    const next = { ...state.filters };
    const trimmed = typeof value === 'string' ? value.trim() : '';
    if (trimmed === '') {
      delete next[name];
      return applyFilters(dataset, next);
    }
    const problem = checkExploreFilter(dataset, name, trimmed);
    if (problem) {
      set({ problems: Object.freeze([problem]) });
      return run();
    }
    next[name] = trimmed;
    return applyFilters(dataset, next);
  }

  function clearFilters() {
    return applyFilters(EXPLORE_DATASETS[state.dataset], {});
  }

  /** Switch what is searched. Filters the new dataset also has are carried; the rest are dropped by name. */
  function setDataset(id) {
    const dataset = exploreDataset(id);
    if (dataset.id === state.dataset) return Promise.resolve(state);
    const carried = {};
    for (const field of dataset.fields) {
      const value = state.filters[field.name];
      if (typeof value === 'string' && !checkExploreFilter(dataset, field.name, value)) carried[field.name] = value;
    }
    set({ dataset: dataset.id, windowPreset: exploreWindowPreset(dataset, state.windowPreset) });
    return applyFilters(dataset, carried);
  }

  function setWindow(preset) {
    const dataset = EXPLORE_DATASETS[state.dataset];
    const next = exploreWindowPreset(dataset, preset);
    if (next === state.windowPreset) return Promise.resolve(state);
    set({ windowPreset: next });
    return run();
  }

  /** Open one result. An event or finding is re-read on its own (Q9); a device or audit row is shown as held. */
  async function open(key) {
    const dataset = EXPLORE_DATASETS[state.dataset];
    const row = state.rows.find((r) => dataset.rowKey(r) === key) ?? null;
    const seq = ++detailSeq;
    if (dataset.detail === 'row') {
      if (!row) return state;
      set({ detail: Object.freeze({ status: 'ready', key, row, record: null, submissionId: null }) });
      return state;
    }
    // A linked record may not be on the page that is loaded; its id is still enough to read it.
    const submissionId = row?.submission_id ?? String(key).split('|')[0];
    set({ detail: Object.freeze({ status: 'loading', key, row, record: null, submissionId }) });
    const record = await ask(() => buildExploreRecordRequest({ submissionId, receivedAtHint: row?.received_at }));
    if (seq !== detailSeq) return state;
    const served = !record.isRefusal && record.data.length > 0;
    set({
      detail: Object.freeze({ status: served ? 'ready' : 'refused', key, row, record, submissionId }),
      shell: shellAfter(record),
    });
    // An event whose content is stored shows it: opening the record is asking to read it.
    if (served && content && String(eventView(record).tiles[0]?.value?.text) === 'uploaded') await retrieveContent();
    return state;
  }

  function close() {
    detailSeq += 1;
    if (state.detail.status !== 'closed') set({ detail: DETAIL_CLOSED });
    return state;
  }

  /**
   * Search prompt text. This is not a filter of the list above it: it is a separate, audited read
   * of the content index, answered with bounded snippets, and a hit is opened like any other event.
   */
  async function searchText(query) {
    const text = String(query ?? '').trim();
    const seq = ++textSeq;
    if (text === '') {
      set({ text: TEXT_IDLE });
      return state;
    }
    if (!content) {
      set({ text: Object.freeze({ ...TEXT_IDLE, status: 'refused', query: text, problem: Object.freeze({ code: 'no_content_path', message: 'This page has no content path behind it.' }) }) });
      return state;
    }
    set({ text: Object.freeze({ ...TEXT_IDLE, status: 'loading', query: text }) });
    const answer = await content.search({ query: text, limit: 20 });
    if (seq !== textSeq) return state;
    if (answer.state !== 'available') {
      set({ text: Object.freeze({ ...TEXT_IDLE, status: 'refused', query: text, problem: Object.freeze(answer.error ?? { code: answer.state, message: 'The search was not served.' }) }) });
      return state;
    }
    set({
      text: Object.freeze({
        status: 'ready', query: text, problem: null,
        hits: Object.freeze((answer.hits ?? []).map((h) => Object.freeze({
          submissionId: String(h.submission_id), snippet: String(h.snippet ?? ''),
          subject: h.subject ?? null, device: h.device ?? null, tool: h.tool ?? null,
        }))),
        truncated: Boolean(answer.truncated),
      }),
    });
    return state;
  }

  function clearText() {
    textSeq += 1;
    if (state.text !== TEXT_IDLE) set({ text: TEXT_IDLE });
    return state;
  }

  /** Open a search hit: the event it belongs to, read on its own like any linked record. */
  async function openHit(submissionId) {
    if (state.dataset !== 'events') await setDataset('events');
    return open(String(submissionId));
  }

  /**
   * Retrieve the content of the open record (docs/02 §11). The case reference and the second
   * approver go to the vault, which decides; a refusal comes back with its reason and is shown.
   */
  async function retrieveContent() {
    const detail = state.detail;
    if (detail.status !== 'ready' || !detail.submissionId || !detail.record) return state;
    const submissionId = detail.submissionId;
    const seq = ++contentSeq;
    const base = { ...CONTENT_IDLE, submissionId };
    if (!content) {
      set({ content: Object.freeze({ ...base, status: 'refused', problem: Object.freeze({ code: 'no_content_path', message: 'This page has no content path behind it.' }) }) });
      return state;
    }
    set({ content: Object.freeze({ ...base, status: 'loading' }) });
    const answer = await content.retrieve({ event_ids: exploreEventIds(detail.record) });
    if (seq !== contentSeq || state.detail.submissionId !== submissionId) return state;
    if (answer.state === 'available' && typeof answer.content === 'string') {
      const split = exploreUserInput(answer.content);
      set({
        content: Object.freeze({
          ...base, status: 'ready', typed: split.typed, kind: split.kind, full: answer.content,
          bytes: answer.content.length, grantId: answer.grant_id ?? null,
        }),
      });
      return state;
    }
    if (answer.state === 'refused' || answer.error) {
      set({ content: Object.freeze({ ...base, status: 'refused', problem: Object.freeze(answer.error ?? { code: 'refused', message: 'The retrieval was refused.' }) }) });
      return state;
    }
    // Content that is gone is an answer, not a failure: the state and its reason are what is shown.
    set({ content: Object.freeze({ ...base, status: 'gone', gone: Object.freeze({ state: answer.state, reason: answer.reason ?? null, receipt: answer.receipt_ref ?? null }) }) });
    return state;
  }

  /** Put retrieved content away without closing the record. */
  function hideContent() {
    contentSeq += 1;
    if (state.content !== CONTENT_IDLE) set({ content: CONTENT_IDLE });
    return state;
  }

  /** Put the page into the state a link describes, search, and open the linked result. */
  async function restore(hash) {
    const decoded = decodeExploreHash(hash);
    set({
      dataset: decoded.dataset.id,
      windowPreset: decoded.windowPreset,
      filters: decoded.filters,
      queryText: formatExploreQuery(decoded.filters, decoded.dataset),
      problems: decoded.problems,
    });
    await run();
    if (decoded.open && state.status === 'ready') await open(decoded.open);
    return state;
  }

  /** The link for the state on screen. */
  function hash() {
    return encodeExploreHash({
      dataset: EXPLORE_DATASETS[state.dataset],
      windowPreset: state.windowPreset,
      filters: state.filters,
      open: state.detail.key,
    });
  }

  return Object.freeze({
    get state() { return state; },
    run, loadMore, setQuery, setFilter, clearFilters, setDataset, setWindow, open, close, restore, hash,
    searchText, clearText, openHit, retrieveContent, hideContent,
  });
}

/**
 * Boot the page into a document. With no `api` it runs on the sample transport and says so.
 *
 * `explore.html?transport=live` reads the real query API instead, through the one endpoint on the
 * page's own origin. The page sends no tenant and no credential: whatever serves the page
 * establishes the session (in the lab, tools/serve.mjs adds the development principal).
 *
 * @param {object} input
 * @param {Document} input.document
 * @param {object} [input.api] a real api, e.g. createQueryApi({transport: httpTransport()})
 */
async function bootExplore({ document, api: given, content: givenContent } = {}) {
  const el = (id) => document.getElementById(id);
  const live = new URLSearchParams(document.location.search).get('transport') === 'live';
  // The same navigation panel as the dashboard: its links lead back to the screens, on the same
  // data source this page reads.
  const shellQuery = live ? '?transport=live' : '';
  const collapsed = readCollapsed(document);
  const nav = el('nav');
  if (nav) nav.innerHTML = renderNav(shellNavItems({ page: `index.html${shellQuery}`, query: shellQuery }), 'explore', { collapsed: [...collapsed] });
  wireShell({ document, live, collapsed });
  const api = given ?? (live ? createQueryApi({ transport: httpTransport() }) : null);
  const stub = api ? null : createExploreStub({ latencyMs: 220 });
  // The content reads follow the same choice as the query read: the page's own origin when live,
  // the sample when not. A caller that passes its own api passes its own content path, or none.
  const content = givenContent
    ?? (given ? null : createContentApi({ transport: live ? httpContentTransport() : stub.content }));
  const textInput = el('x-text-query');
  let lastHash = null;

  const explorer = createExplorer({ api: api ?? createQueryApi({ transport: stub }), content, onChange: paint });

  /** Replace a region only when its markup changed, so an untouched region keeps its focus. */
  const painted = new Map();
  function put(id, html) {
    if (painted.get(id) === html) return;
    painted.set(id, html);
    el(id).innerHTML = html;
  }

  /** The control that has focus, described so its replacement can be found after a repaint. */
  function focusMark() {
    const active = document.activeElement;
    if (!active || active === document.body) return null;
    if (active.id) return { id: active.id };
    return active.dataset?.act ? { data: { ...active.dataset } } : null;
  }

  function restoreFocus(mark) {
    if (!mark || (document.activeElement && document.activeElement !== document.body)) return;
    const match = mark.id
      ? el(mark.id)
      : [...document.querySelectorAll('[data-act]')].find((node) => Object.entries(mark.data).every(([k, v]) => node.dataset[k] === v));
    if (match) match.focus();
  }

  function paint(state) {
    const mark = focusMark();
    put('x-datasets', renderExploreDatasets(state));
    put('x-window', renderExploreWindow(state));
    put('x-problems', renderExploreProblems(state));
    put('x-text', renderExploreText(state));
    put('x-rail', renderExploreRail(state));
    put('x-summary', renderExploreSummary(state));
    put('x-results', renderExploreResults(state));
    el('x-results').setAttribute('aria-busy', String(state.status === 'loading'));
    put('x-detail', renderExploreDetail(state));
    el('x-detail').hidden = state.detail.status === 'closed';
    el('x-body').classList.toggle('x-has-detail', state.detail.status !== 'closed');
    // A prompt-text search takes over the results; the list and its filters come back when it is cleared.
    el('x-page').classList.toggle('x-text-active', state.text.status !== 'idle');
    restoreFocus(mark);
    const next = explorer.hash();
    if (next !== lastHash) {
      lastHash = next;
      try {
        document.defaultView.history.replaceState(null, '', next);
      } catch {
        document.location.hash = next;
      }
    }
  }

  function focusDetail() {
    const title = el('x-detail-title');
    if (title) title.focus();
  }

  async function openRow(key) {
    const pending = explorer.open(key);
    focusDetail();
    await pending;
  }

  function closeDetail() {
    const key = explorer.state.detail.key;
    explorer.close();
    const row = key ? [...document.querySelectorAll('.x-row')].find((r) => r.dataset.key === key) : null;
    if (row) row.focus();
  }

  el('x-text-form').addEventListener('submit', (event) => {
    event.preventDefault();
    explorer.searchText(textInput.value);
  });
  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-act]');
    if (!target) return;
    const { act } = target.dataset;
    if (act === 'dataset') explorer.setDataset(target.dataset.dataset);
    else if (act === 'window') explorer.setWindow(target.dataset.window);
    else if (act === 'toggle') {

      explorer.setFilter(target.dataset.field, on ? '' : target.dataset.value);
    } else if (act === 'filter') explorer.setFilter(target.dataset.field, target.dataset.value);
    else if (act === 'clear') explorer.clearFilters();
    else if (act === 'run') explorer.run();
    else if (act === 'more') explorer.loadMore();
    else if (act === 'open') openRow(target.dataset.key);
    else if (act === 'close') closeDetail();
    else if (act === 'hit') {
      const pending = explorer.openHit(target.dataset.submission);
      focusDetail();
      pending.then(focusDetail);
    } else if (act === 'text-clear') {
      textInput.value = '';
      explorer.clearText();
    } else if (act === 'retrieve') explorer.retrieveContent();
  });

  // A filter is applied when it is committed: a choice from a list, or Enter in a text field.
  el('x-rail').addEventListener('change', (event) => {
    const field = event.target.dataset?.field;
    if (field) explorer.setFilter(field, event.target.value);
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && explorer.state.detail.status !== 'closed') {
      closeDetail();
      return;
    }
    const row = event.target.closest?.('.x-row');
    if (!row) return;
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openRow(row.dataset.key);
    } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      const sibling = event.key === 'ArrowDown' ? row.nextElementSibling : row.previousElementSibling;
      if (sibling) {
        event.preventDefault();
        sibling.focus();
      }
    }
  });

  const scenario = el('x-scenario');
  if (stub) {
    scenario.innerHTML = EXPLORE_SCENARIO_NAMES.map((name) => `<option value="${name}">${escapeHtml(EXPLORE_SCENARIOS[name])}</option>`).join('');
    scenario.addEventListener('change', () => {
      stub.setScenario(scenario.value);
      explorer.run();
    });
  } else {
    el('x-sample').hidden = true;
  }

  document.defaultView.addEventListener('hashchange', () => {
    if (document.location.hash !== lastHash) explorer.restore(document.location.hash);
  });

  await explorer.restore(document.location.hash);
  return { explorer, stub };
}
