# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# Applied after every bundle listed in package.json's `dsh.profile.bundles`.
# The host half registers `GET /api/project-cockpit` and the `project_cockpit`
# tool; the client half registers the sidebar icon and the panel it opens.
#
# To tune it without editing this file, override the row in the profile's own
# cordis.patch.yml (the user layer outranks every bundle layer):
#
#   - id: project-cockpit
#     name: 'dsh-project-cockpit'
#     config:
#       root: ''          # '' means "use each session's own working directory"
#       ttlMs: 2000
#       maxFiles: 4000
- insert:
    - id: project-cockpit
      name: 'dsh-project-cockpit'
