# policy-scan.yml — the properties that must never regress (docs/05-platform-delivery.md §3.3, §3.5).
#
# A CI policy check fails the build if `content-vault` is instantiated with external ingress (D7).
# This pipeline is that check plus its neighbours: the static rules from azure/tools run on every
# pull request that touches azure/, and they run without an Azure subscription — so the properties
# are enforced on the change that would break them, not on the next deployment.
#
# This is also the pipeline that carries the two §5.3 separation-of-duties assertions: unwrap on a
# KEK is held by exactly one identity, and no principal other than content-vault appears in it.

name: policy-scan

on:
  pull_request:
    paths:
      - 'azure/**'
  push:
    branches: [main]
    paths:
      - 'azure/**'

permissions:
  contents: read

jobs:
  static:
    name: static invariants (no Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: the checker suite
        run: node --test azure/tools/index.mjs
      - name: the checker report
        run: node azure/tools/check-infra.mjs

  content-vault-ingress:
    name: content-vault is internal-only (D7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Grep-level checks so the failure message names the paragraph a reviewer should read.
      - name: content-vault ingress
        shell: bash
        run: |
          set -euo pipefail
          BLOCK=$(awk '/module contentVaultApp/,/^}/' azure/main.bicep)
          echo "$BLOCK"
          echo "$BLOCK" | grep -q "ingress: 'internal'" || {
            echo "::error file=azure/main.bicep::content-vault must be instantiated with ingress: internal (docs/05 §3.3, D7, C15)"
            exit 1
          }
          echo "$BLOCK" | grep -q "ingress: 'external'" && {
            echo "::error file=azure/main.bicep::content-vault must never take external ingress"
            exit 1
          }
          exit 0
      - name: no Front Door route to content-vault
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq 'content[-_]?vault' azure/modules/frontdoor.bicep; then
            echo "::error file=azure/modules/frontdoor.bicep::Front Door must not reference content-vault; it has no public endpoint (C15, D7)"
            exit 1
          fi

  database-not-public:
    name: the database has no public path (§2.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publicNetworkAccess and firewall rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "publicNetworkAccess: 'Disabled'" azure/modules/postgres.bicep || {
            echo "::error file=azure/modules/postgres.bicep::PostgreSQL must declare publicNetworkAccess Disabled"
            exit 1
          }
          if grep -rq 'flexibleServers/firewallRules' azure/; then
            echo "::error::a PostgreSQL firewall rule exists; the server must have no firewall rules at all (§2.1)"
            exit 1
          fi

  separation-of-duties:
    name: unwrap is content-vault's alone (§5.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: one unwrap principal
        shell: bash
        run: |
          set -euo pipefail
          PRINCIPALS=$(awk '/unwrapPrincipalIds:/,/\]/' azure/main.bicep | grep -c 'identityVault.properties.principalId' || true)
          if [ "$PRINCIPALS" != "1" ]; then
            echo "::error file=azure/main.bicep::exactly one principal may hold unwrap on per-tenant KEKs (C15, D7)"
            exit 1
          fi
          if grep -Eq 'unwrapPrincipalIds:[^]]*identity(Ingest|Control|Query|Aggregator|Reconciler|Migration)' azure/main.bicep; then
            echo "::error file=azure/main.bicep::a service other than content-vault holds unwrap"
            exit 1
          fi
